<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>VNDCARE Nhà nghề</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: khung app 3 vùng (sidebar 240 | nội dung | trợ lý 360). Nhóm màn theo ba chiều của la bàn: Người · Khách · Máy. Mỗi lúc một kim sáng. */
:root{
  --bg:#F4F4F5; --panel:#FFFFFF; --panel-2:#FAFAFA; --fg:#18181B; --muted:#71717A; --line:#E4E4E7;
  --primary:#2563EB; --primary-h:#1D4ED8; --primary-soft:#EFF6FF; --primary-ink:#1E40AF;
  --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#D97706; --warn-soft:#FEF3C7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --agent:#7C3AED; --agent-soft:#F3E8FF; --ring:rgba(37,99,235,.28); --shadow:0 8px 24px rgba(0,0,0,.12);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090B; --panel:#131316; --panel-2:#18181C; --fg:#F4F4F5; --muted:#A1A1AA; --line:#27272A;
  --primary:#3B82F6; --primary-h:#60A5FA; --primary-soft:#172554; --primary-ink:#BFDBFE;
  --ok:#4ADE80; --ok-soft:#052E16; --warn:#FBBF24; --warn-soft:#3B2A05; --bad:#F87171; --bad-soft:#3F1010;
  --agent:#A78BFA; --agent-soft:#2E1065; --ring:rgba(96,165,250,.35); --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090B; --panel:#131316; --panel-2:#18181C; --fg:#F4F4F5; --muted:#A1A1AA; --line:#27272A;
  --primary:#3B82F6; --primary-h:#60A5FA; --primary-soft:#172554; --primary-ink:#BFDBFE;
  --ok:#4ADE80; --ok-soft:#052E16; --warn:#FBBF24; --warn-soft:#3B2A05; --bad:#F87171; --bad-soft:#3F1010;
  --agent:#A78BFA; --agent-soft:#2E1065; --ring:rgba(96,165,250,.35); --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;box-shadow:0 0 0 4px var(--ring)}
.num{font-variant-numeric:tabular-nums}
body.audit .act{pointer-events:none;opacity:.45}

.app{display:grid;grid-template-columns:240px minmax(0,1fr) 360px;height:calc(100dvh - 32px);min-height:680px;max-width:1720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}

/* Sidebar */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:2px;background:var(--panel-2);min-width:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:600;font-size:15px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.nav-g{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;background:transparent;border-radius:6px;color:var(--muted);font-weight:500;text-align:left;transition:background 150ms ease-out}
.nav button:hover{background:var(--line);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary-ink)}
.nav .k{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid currentColor;opacity:.7}
.pill{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.pill[hidden]{display:none}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:8px}
.role-sel{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 8px;width:100%}
.av{width:28px;height:28px;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.av.ag{background:var(--agent-soft);color:var(--agent)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line)}
.top h1{font-size:16px;font-weight:600;margin:0;white-space:nowrap}
.top .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background 150ms ease-out;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chat-toggle{display:none}
.scroll{flex:1;min-height:0;overflow:auto;padding:24px}
.view[hidden]{display:none}
.lead{margin:0 0 16px;color:var(--muted);max-width:720px}
.ro-banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:16px;font-weight:500}
.ro-banner[hidden]{display:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.soft{background:var(--primary-soft);border-color:transparent}
.panel h2,.panel h3{margin:0;font-size:14px;font-weight:600}
.panel p{margin:0;color:var(--muted);font-size:13px}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph small{color:var(--muted)}
.ph .sp{flex:1}
.sec-h{margin:24px 0 12px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sec-h:first-child{margin-top:0}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--primary-soft);color:var(--primary-ink);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.ag{background:var(--agent-soft);color:var(--agent)}
.badge.gray{background:var(--line);color:var(--muted)}
.lock{color:var(--muted);font-size:12px;display:inline-flex;gap:4px;align-items:center}
.src{font-size:12px;color:var(--muted)}
.lnk{border:0;background:transparent;color:var(--primary);padding:0;font-size:12px;text-decoration:underline}
.quote{border-left:3px solid var(--primary);padding:6px 12px;background:var(--panel-2);border-radius:0 6px 6px 0;font-size:13px}
.quote.empty{border-left-color:var(--line);color:var(--muted)}
.kims{display:flex;gap:6px;flex-wrap:wrap}
.kim{height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:500;display:inline-flex;align-items:center;background:var(--panel)}
.kim.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 3px var(--ring)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Nhà nghề */
.hero{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero h2{font-size:18px;margin:0 0 4px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:620px}
.sparkcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.sparkcard .t{font-weight:600}
.sparkcard .s{font-size:13px;color:var(--muted)}
.tgl{display:flex;align-items:center;gap:8px;font-size:13px}
.tgl input{width:16px;height:16px;accent-color:var(--primary)}
.feed{display:flex;flex-direction:column;gap:12px}
.note{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.note .t{font-weight:600}
.note.unread{border-color:var(--primary)}
.thread{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.thread form{display:flex;gap:8px}
.thread input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--panel)}
.cap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cap div{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;background:var(--panel-2)}
.cap b{display:block;font-size:13px}

/* Hộp chăm / bản máy: 2 khung */
.two{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink);border-color:var(--primary)}
.list{display:flex;flex-direction:column;gap:8px}
.li{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.li:hover{border-color:var(--primary)}
.li[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.li .t{font-weight:600}
.li .s{color:var(--muted);font-size:12px}
.li .r{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.detail{border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
.d-h{display:flex;gap:10px;align-items:center;padding:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.d-h .t{font-weight:600;min-width:0}
.d-h .sp{flex:1}
.d-b{padding:16px;display:flex;flex-direction:column;gap:16px}
.d-b h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.d-f{display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap;align-items:center}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--primary-soft);border-color:transparent}
.convo{display:flex;flex-direction:column;gap:8px}
.draft{width:100%;min-height:110px;border:1px solid var(--agent);border-radius:6px;background:var(--agent-soft);padding:12px;line-height:1.55;font-size:13px;resize:vertical}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;font-size:13px}
.steps .ty{font-size:12px;font-weight:600;color:var(--agent)}
.refine{display:flex;gap:8px}
.refine input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--panel)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:32px;text-align:center;color:var(--muted)}

/* Sổ khách */
.board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{margin:4px 6px 0;font-size:13px;font-weight:600}
.col .hand{margin:0 6px;font-size:12px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;transition:border-color 150ms ease-out}
.card:hover{border-color:var(--primary)}
.card .n{font-weight:600}
.card .s{color:var(--muted);font-size:13px}

/* Ngồi cùng khách */
.rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ne{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ne b{font-size:18px;line-height:1}
.ne span{font-size:12px;color:var(--muted)}
.ne[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--ring)}
.ne.done b{color:var(--ok)}
.letters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.tl{display:flex;flex-direction:column;gap:10px}
.tl .e{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13px}
.tl .d{color:var(--muted);font-size:12px}
textarea.plain{width:100%;min-height:72px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:10px;resize:vertical;line-height:1.5;font-size:13px}
.sheet{border:1px dashed var(--agent);border-radius:8px;padding:12px;background:var(--agent-soft);display:flex;flex-direction:column;gap:6px;font-size:13px}
.sheet[hidden]{display:none}
select.sel{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 8px;max-width:100%}

/* Thước */
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}
.metric{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.metric:first-of-type{border-top:0}
.metric .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.how{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:8px}
.how[hidden]{display:none}

/* Bản máy / quyền */
.tw{border:1px solid var(--line);border-radius:8px;overflow:auto;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:600px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:0 16px;height:36px;background:var(--panel-2);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.02em}
td{padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.sub td{background:var(--panel-2);color:var(--muted);font-size:13px}
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}
code{font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.gate{border:1px dashed var(--line);border-radius:8px;padding:12px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}

/* Chat */
.chat{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
.chat-h{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.chat-h .t{font-weight:600}
.ctx{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12px;color:var(--muted)}
.ctx b{color:var(--fg);font-weight:500}
.ctx button{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline}
.msgs{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:92%;display:flex;flex-direction:column;gap:6px}
.m.me{align-self:flex-end}
.bub{padding:8px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);overflow-wrap:anywhere}
.m.me .bub{background:var(--primary);border-color:var(--primary);color:#fff}
.res{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.res.refuse{border-color:var(--warn);background:var(--warn-soft)}
.res .r{display:flex;justify-content:space-between;gap:8px}
.clar{margin:0 16px 8px;border:1px solid var(--agent);background:var(--agent-soft);border-radius:8px;padding:10px 12px}
.clar[hidden]{display:none}
.clar p{margin:0 0 8px;font-weight:500}
.clar .o{display:flex;gap:6px;flex-wrap:wrap}
.clar button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--agent);background:var(--panel);font-size:12px}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.sug button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px}
.sug button:hover{border-color:var(--primary);background:var(--primary-soft)}
.compose{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 12px;background:var(--panel)}
.proto{font-size:11px;color:var(--muted);padding:0 16px 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-weight:500;z-index:50;max-width:90vw}
.toast[hidden]{display:none}
.gloss{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:16px}
.gloss[hidden]{display:none}
/* Phòng chăm khách */
.chat .room{display:none;flex:1;min-height:0;flex-direction:column}
.chat.room-mode .room{display:flex}
.chat.room-mode>.ctx,.chat.room-mode>.msgs,.chat.room-mode>.clar,.chat.room-mode>.sug,.chat.room-mode>.compose,.chat.room-mode>.proto{display:none}
.room-h{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;gap:8px}
.room-h b{font-size:13px}
.mem{display:flex;gap:6px;flex-wrap:wrap}
.invite{display:flex;gap:6px}
.invite select{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 6px;font-size:12px}
.rsys{text-align:center;font-size:12px;color:var(--muted);padding:2px 8px}
.rm{display:flex;gap:8px;align-items:flex-start}
.rm .body{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.rcard{border:1px solid var(--agent);background:var(--agent-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rcard.refuse{border-color:var(--warn);background:var(--warn-soft)}
.rcard .bd{white-space:pre-line;overflow-wrap:anywhere}
.fin{height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--panel);width:100%;max-width:300px}
/* Tab của khung hồ sơ (canvas) */
#v-ngoi-cung[data-tab="ho-so"]>*:nth-child(n+4){display:none}
#v-ngoi-cung[data-tab="la-ban"]>*:nth-child(2),#v-ngoi-cung[data-tab="la-ban"]>*:nth-child(3),#v-ngoi-cung[data-tab="la-ban"]>*:nth-child(6){display:none}
#v-ngoi-cung[data-tab="sau-buoi"]>*:nth-child(n+2):nth-child(-n+5){display:none}
/* Bố cục kiểu Slack: phòng ở giữa, hồ sơ sống ở bên phải */
@media (min-width:1181px){
  .app.room-mode{grid-template-columns:240px minmax(0,1fr) minmax(380px,440px)}
  .app.room-mode .side{order:1}
  .app.room-mode .chat{order:2;border-left:0;border-right:1px solid var(--line)}
  .app.room-mode .main{order:3}
  .app.room-mode .rail{grid-template-columns:1fr}
  .app.room-mode .tw table{min-width:0!important}

      <div class="panel"><h3>Cùng khách xem lại giao dịch</h3><p>Trước một giao dịch, cùng khách đọc năm câu hỏi VNDGO. Lưu lại để đọc được sau một năm.</p>

        <h3>Tìm người đỡ (iLink)</h3><div class="row"><select class="sel" id="helpSel" aria-label="Chỗ đang vướng"><option value="">Chọn chỗ đang vướng…</option>${Object.keys(HELP).map(function(h){return '<option>'+h+'</option>'}).join('')}</select></div><span class="src" id="helpOut">Chọn chỗ vướng để ra đúng tên người đỡ.</span></div>
    </div>

      <div class="panel"><h3>Nhìn lại sau buổi gặp · tám chữ VNDCARE</h3><p>Tự hỏi: buổi này mình đã làm được những điều nào trong tám điều nhà hứa với khách, còn thiếu điều nào?</p>
        <div class="letters">${VNDCARE.map(function(v){return '<label class="tgl act"><input type="checkbox" data-letter="'+v[0]+'"'+(soi[v[0]]?' checked':'')+'> <b>'+v[0]+'</b> '+v[1]+'</label>'}).join('')}</div>

      <div class="panel"><h3>Dấu vết chăm</h3><div class="tl">${k.tl.length?k.tl.map(function(e){var w=e.w==='khach'?['Khách kể','ok']:e.w==='ca'?['CA ghi','']:['Máy soạn','ag'];return '<div class="e"><span class="d">'+e.t+'</span><div><span class="badge '+w[1]+'">'+w[0]+'</span> '+esc(e.x)+(e.l?' <span class="src">Chữ: '+e.l+'</span>':'')+'</div></div>'}).join(''):'<span class="src">Chưa có dấu vết. Lần chạm đầu sẽ được ghi tại đây.</span>'}</div></div>
    </div>`;

  /* ====== Màn: Bàn giao ====== */
  var HAND=['Hồ sơ la bàn giữ nguyên lời khách','Dấu vết chăm và lịch sử buổi gặp','Kế hoạch đang chạy và đích khách tự đặt','Nhịp đã hẹn còn lại và biến cố đang mở','Người đỡ đã biết khách (iLink)','Lời giới thiệu người mới với khách'];
  function vGiao(){
    var h=state.hand,k=K(h.sel),all=HAND.every(function(_,i){return h.ticks[h.sel+i]});
    return `<p class="lead">Khách không phải kể lại từ đầu khi người đồng hành đổi. Hồ sơ và kế hoạch ở lại, người mới đọc được câu chuyện. <b>Người duyệt phải khác người rời.</b><span class="src" style="display:block">Sáu việc dưới đây là bản mẫu theo cẩm nang, cần đối chiếu với tờ BeOut gốc trước khi dùng thật.</span></p>
    <div class="grid g2"><div class="panel"><div class="ph"><h3>Bàn giao khách</h3><span class="sp"></span><select class="sel" id="hSel" aria-label="Chọn khách">${khach.filter(function(x){return x.goi==='DCA'}).map(function(x){return '<option value="'+x.id+'"'+(x.id===h.sel?' selected':'')+'>'+x.id+' · '+esc(x.name)+'</option>'}).join('')}</select></div>
      ${HAND.map(function(x,i){return '<label class="tgl act"><input type="checkbox" data-hand="'+i+'"'+(h.ticks[h.sel+i]?' checked':'')+'> '+x+'</label>'}).join('')}
      <div class="row act"><button class="btn primary" id="sendHand"${all&&!h.sent?'':' disabled'}>Gửi bàn giao để duyệt</button>${h.sent?'<span class="badge ok">Đã gửi, chờ người duyệt</span>':'<span class="src">Cần đủ sáu việc.</span>'}</div>
      <div class="gate"><b>Người duyệt: Lê Minh Quân (mẫu, đội trưởng)</b><span class="src">Khác người rời. Khách ở lại Be-in. Quyền app của người rời khóa khi bàn giao được duyệt.</span></div></div>
      <div class="panel"><div class="ph"><h3>Câu chuyện của khách cho người mới</h3><span class="badge ag">Bản máy</span></div>
      <p>Máy tóm tắt từ lời khách và dấu vết chăm, giữ nguyên văn. CA đọc và quyết trước khi gửi.</p>
      <div class="quote">${k.ne.V?esc(k.ne.V):'Khách chưa kể đích bằng lời của mình.'}</div>
      <span class="src">Chặng: ${STAGE[k.st][0]} · ${k.tl.length} dấu vết chăm · Biến cố đang mở: ${esc(k.ev)}</span>
      <span class="src">Khách chọn giữ hay xóa hồ sơ khi rời. Một người khác CA hỏi khách vì sao rời. CA đổi không có nghĩa là khách rời.</span></div></div>`;
  }

  /* ====== Màn: Bản máy ====== */
  function vBan(){
    var tabs=`<div class="filters"><button class="chip" data-bm="doc" aria-pressed="${state.bm==='doc'}">CA đọc và quyết</button><button class="chip" data-bm="log" aria-pressed="${state.bm==='log'}">Nhật ký</button></div>`;
    return `<p class="lead">Máy chỉ chuẩn bị. Mỗi bản máy cho thấy nội dung, kết quả kiểm lan can, các bước đã làm và nguồn. CA đọc rồi quyết. Nhật ký là chỗ đọc lại được sau một năm.</p>${tabs}${state.bm==='doc'?banDoc():banLog()}`;
  }
  function banDoc(){
    var f=state.bmF,list=ITEMS.filter(function(i){return f==='all'||(f==='needs'?i.st==='needs'||i.st==='waiting':i.st!=='needs'&&i.st!=='waiting')});
    if(list.length&&!list.some(function(i){return i.id===state.bmSel}))state.bmSel=list[0].id;
    var it=list.length?ITEMS.filter(function(i){return i.id===state.bmSel})[0]:null;
    return `<div class="filters"><button class="chip" data-bf="needs" aria-pressed="${f==='needs'}">Cần quyết</button><button class="chip" data-bf="done" aria-pressed="${f==='done'}">Đã xử lý</button><button class="chip" data-bf="all" aria-pressed="${f==='all'}">Tất cả</button></div>
    <div class="two"><div class="list">${list.map(function(i){var s=STATUS[i.st];return `<button class="li" data-bi="${i.id}" aria-pressed="${i.id===state.bmSel}"><span class="t">${i.v} ${esc(i.title)}</span><span class="s">${i.by}</span><span class="r"><span class="badge ${s[1]}">${s[0]}</span><span class="s num">${i.cost} lượt AI</span></span></button>`}).join('')||'<div class="empty">Không có mục nào.</div>'}</div>
    <div class="detail">${it?itemDetail(it):'<div class="empty" style="border:0">Chọn một mục.</div>'}</div></div>`;
  }
  function itemDetail(a){
    var s=STATUS[a.st];
    var foot=a.st==='needs'?`<div class="d-f act"><button class="btn primary" data-ok="${a.id}">${a.ok}</button><button class="btn danger" data-no="${a.id}">Bỏ</button><span class="src" style="margin-left:auto">Ước tính ${a.cost} lượt AI.</span></div>`:'';
    var refine=a.st==='needs'?`<div><h4>Nhờ máy chỉnh</h4><form class="refine" id="refine"><input id="refIn" placeholder="Ví dụ: ngắn hơn" aria-label="Yêu cầu chỉnh"><button class="btn act" type="submit">Chỉnh</button></form></div>`:'';
    return `<div class="d-h"><span class="av ag">${a.v}</span><span class="t">${esc(a.title)}</span><span class="sp"></span><span class="badge ${s[1]}">${s[0]}</span></div>
    <div class="d-b"><div><h4>Bản máy</h4><div class="sheet" style="white-space:pre-line">${esc(a.body)}</div></div>
    <div><h4>Kiểm lan can</h4><div class="checks">${a.checks.map(function(c){return '<span class="badge '+c[1]+'">'+(c[1]==='ok'?'✓ ':'✕ ')+esc(c[0])+'</span>'}).join('')}</div></div>
    <p class="src" style="margin:0"><b style="color:var(--fg)">Lý do:</b> ${esc(a.why)}</p>
    <div><h4>Các bước máy đã làm</h4><ul class="steps">${a.steps.map(function(x){return '<li><span class="ty">'+x[0]+'</span><span>'+esc(x[1])+'</span></li>'}).join('')}</ul></div>
    <div><h4>Nguồn</h4><span class="src">${a.src.map(esc).join(' · ')}</span></div>${refine}</div>${foot}`;
  }
  function banLog(){
    var rows=logs.filter(function(l){return state.logF==='all'||l.a===state.logF}),h='';
    rows.forEach(function(l){var i=logs.indexOf(l),o=!!state.logOpen[i];
      h+=`<tr><td class="num" style="white-space:nowrap;color:var(--muted)">${l.t}</td><td><span class="badge ${l.a==='agent'?'ag':'gray'}">${l.a==='agent'?'Máy':'Người'}</span> ${esc(l.n)}</td><td><button class="lnk" data-lo="${i}" style="color:var(--fg);text-decoration:none;text-align:left">${o?'▾ ':'▸ '}${esc(l.what)}</button></td><td><code>${l.ev}</code></td><td class="src">${esc(l.src)}</td><td><span class="badge ${l.cls}">${l.st}</span></td></tr>`;
      if(o)h+=`<tr class="sub"><td colspan="6"><ul class="steps" style="color:var(--fg)">${l.steps.map(function(x){return '<li><span class="ty">'+x[0]+'</span><span>'+esc(x[1])+'</span></li>'}).join('')}</ul></td></tr>`});
    return `<div class="filters"><button class="chip" data-lf="all" aria-pressed="${state.logF==='all'}">Tất cả</button><button class="chip" data-lf="agent" aria-pressed="${state.logF==='agent'}">Máy</button><button class="chip" data-lf="human" aria-pressed="${state.logF==='human'}">Người</button><button class="btn" id="copyJson" style="margin-left:auto">Sao chép JSON</button></div>
    <div class="tw"><table><thead><tr><th>Giờ</th><th>Ai làm</th><th>Việc đã làm</th><th>Sự kiện CU_BIS</th><th>Nguồn</th><th>Trạng thái</th></tr></thead><tbody>${h}</tbody></table></div>`;
  }

  /* ====== Màn: Thước ====== */
  var MET={
    khach:[['Khách lên một bậc vị thế','so với chính họ kỳ trước',58,'Đọc từ AMS + TMS, mỗi khách so với chính mình.'],['Khách giữ kỷ luật khi thị trường giảm','không bán tháo trái luật họ tự đặt',72,'Đọc từ TMS khi có biến cố, so với luật khách tự đặt.'],['Chạm đúng nhịp đã hứa','kể cả kỳ không có giao dịch',81,'Sự kiện touch_held so với nhịp của gói (SLA).'],['Khách ở lại khi có biến cố hay khi CA đổi','đọc lúc biến cố',90,'Đọc lúc biến cố, không đợi cuối kỳ.'],['Khách tự đọc được Dvalues','buổi đọc lại theo kỳ',44,'Sự kiện compass_selfread trên app VNDGO.']],
    nghe:[['Số ngày đọc đủ bốn kim','đếm ngày, không chấm nội dung',70,'Đếm ngày compass_selfread của chính CA.'],['Lượt soi đủ ba bậc','đếm lượt, không chấm nội dung',50,'Sự kiện ipax_round_completed.'],['Khoản năng lực nghề đã khớp','đọc từ FVH, FD Lead xác nhận',40,'Đọc từ FVH, FD Lead xác nhận.']]
  };
  function metBlock(key,title,sub){return `<div class="panel"><h2>${title}</h2><p>${sub}</p>${MET[key].map(function(m,i){var id=key+i;return `<div class="metric"><div class="h"><b>${m[0]}</b><span class="src">${m[1]}</span></div><div class="bar" role="img" aria-label="Giá trị mẫu"><i style="width:${m[2]}%"></i></div><div class="row"><button class="lnk" data-how="${id}">${state.how[id]?'Ẩn cách tính':'Xem cách tính'}</button><span class="badge gray">mẫu</span></div><div class="how" ${state.how[id]?'':'hidden'}>${m[3]}</div></div>`}).join('')}</div>`}
  function vThuoc(){
    return `<p class="lead">Hai thẻ đọc riêng: khách của bạn lớn lên thế nào, và nghề của bạn lớn lên thế nào. Không gộp thành một bảng. <b>Doanh số không phải thước chính.</b> Thanh dưới đây là giá trị mẫu để xem bố cục, không phải số thật.</p>
    <div class="grid g2">${metBlock('khach','Khách của tôi lớn lên','Thước phía khách. Mỗi khách so với chính họ.')}${metBlock('nghe','Nghề của tôi lớn lên','Thước phía nghề. Người làm nghề xem được cách con số của mình được tính.')}</div>
    <div class="panel" style="margin-top:16px"><h3>Nhà đo khác thế giới ở đâu</h3><p>Các hệ chăm sóc khách hiện đại thường đo tỷ lệ giải quyết tự động, CSAT và chi phí mỗi lần xử lý. Nhà đo khách có giữ được nếp đầu tư của họ không. Ba thước của thế giới vẫn hữu ích cho đội chăm số (gói DA), nhưng không thay thước của nhà.</p></div>`;
  }

  /* ====== Màn: Trợ lý & quyền ====== */
  function vQuyen(){
    var LC=[['Không liên lạc khách: không gửi, gọi, đặt lịch thay khách','Không có công cụ gửi trong API'],['Không chấm điểm, không xếp hạng khách; CMI ở trong nhà','Không có endpoint xếp hạng; trường CMI ẩn với khách'],['Không gợi ý mã, không dự phóng lãi, không chào bán','Kiểm đầu ra trước khi hiện cho CA'],['Chỉ đọc trường khách đã đồng ý','Cổng dữ liệu lọc theo trường đồng ý'],['Không dùng la bàn và sổ chăm để chấm doanh số CA','Schema không có trường doanh số theo CA'],['Lời khách giữ nguyên văn; số không khớp sổ thì dừng','Đối soát lệch quá 0,5% thì máy dừng; mọi bản ra là bản máy']];
    return `<p class="lead">VNDCARE Agent chuẩn bị cho CA, không nói chuyện với khách. Lan can được ép ở tầng API và schema, không chỉ dặn trong prompt.</p>
    <div class="grid g2"><div class="panel"><div class="ph"><span class="av ag">VC</span><h3>VNDCARE Agent · đang chạy</h3><span class="sp"></span><span class="badge ok">Chế độ bóng</span></div>
      <p>Năm việc, năm nhịp. Người giữ agent: Head CU_VNDCARE (ô chờ tên).</p>
      <div class="tw"><table style="min-width:520px"><thead><tr><th>Việc</th><th>Nhịp</th><th>Máy không làm</th></tr></thead><tbody>
      <tr><td>① Tóm tắt sáng (La bàn sáng)</td><td>Mỗi sáng</td><td>Xếp hạng, chấm điểm</td></tr><tr><td>② Chuẩn bị buổi đồng hành</td><td>Trước lịch hẹn</td><td>Kịch bản chào bán</td></tr><tr><td>③ Nháp kế hoạch đầu tư (Dinvest)</td><td>Khi CA gọi</td><td>Mã, dự phóng lãi; trình khách</td></tr><tr><td>④ Đọc kết quả cuối kỳ (Dvalues)</td><td>Cuối kỳ</td><td>Đưa điểm CMI cho khách</td></tr><tr><td>⑤ Sổ chăm</td><td>Sau mỗi buổi gặp</td><td>Đánh giá CA</td></tr></tbody></table></div></div>
    <div class="panel"><div class="ph"><span class="av">VG</span><h3>VNDGO Agent · khóa</h3><span class="sp"></span><span class="badge gray">Chưa mở</span></div>
      <p>Agent cho chính khách, chạy trên app. Chỉ mở khi VNDCARE Agent chạy song song đủ một quý. Hai agent đọc cùng bốn kim, một khách chỉ có một la bàn.</p>
      <div class="gate"><b>Cổng mở: sau một quý chạy song song</b><div class="bar"><i style="width:12%"></i></div><span class="src">Tiến độ mẫu. Đây là chỗ nhà cố ý đi chậm hơn xu hướng tự giải quyết của thế giới.</span></div></div>

    <div class="panel wide" style="grid-column:1/-1"><h3>Lan can và nơi ép</h3><div class="tw"><table><thead><tr><th>Lan can của nhà</th><th>Ép ở đâu</th></tr></thead><tbody>${LC.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')}</tbody></table></div></div>

    <div class="panel"><h3>Dữ liệu agent được đọc</h3><div class="tw"><table style="min-width:420px"><thead><tr><th>Luồng</th><th>Đọc</th><th>Ghi</th></tr></thead><tbody><tr><td>Hồ sơ khách (CMS) · Tài sản (AMS) · Kế hoạch (OMS) · Sản phẩm (PMS) · CA đi cùng (iMS)</td><td>●</td><td></td></tr><tr><td>Giao dịch, buổi gặp (TMS)</td><td>●</td><td>Dấu vết chăm (việc ⑤)</td></tr><tr><td>FMS</td><td colspan="2">Không đọc</td></tr></tbody></table></div><p>Không đọc kết quả soi sáng và dữ liệu hành vi khi khách chưa đồng ý riêng. Khách chỉ là mã trong KMS.</p></div>
    <div class="panel"><h3>Cách làm của trợ lý là các tờ nhà đã viết</h3><p>Đổi cách làm bằng cách sửa tờ, không viết lại code.</p>
      <div class="checks"><span class="badge">AppCompass 2.1</span><span class="badge">BonKim</span><span class="badge">CompassSignals</span><span class="badge">ClientIndicators L1–L10</span><span class="badge gray">Agent_Card 0.1</span></div>
      <div class="row act"><button class="btn" data-toast="Chạy thử trên 5 bộ câu trả lời mẫu: 0 hành động thật, 0 credit (mẫu).">Chạy thử trên bộ mẫu</button></div></div>
    <div class="panel wide" style="grid-column:1/-1"><h3>Quyết định đang mở · dữ liệu khách đi đường nào</h3><div class="grid g2"><div class="gate"><b>(a) Agent chạy trong hệ thống của nhà qua cổng API</b><span class="src">Có kiểm quyền từng lần gọi. Cần IT nối, chậm hơn khoảng một quý. Đề xuất chọn.</span></div><div class="gate"><b>(b) Xuất tệp mã hóa hằng ngày vào KMS</b><span class="src">Nhanh hơn nhưng dữ liệu khách nhiều lớp đi qua thư mục dùng chung, rủi ro lộ cao hơn hẳn.</span></div></div></div></div>`;

    function refuse(a,why,nep,inst){rpost(k,{s:'ag',card:{refuse:1,t:'Mình không làm việc này: '+a,b:why+'\nNếp: '+nep+'\nThay vào đó: '+inst}})}
    if(/xếp hạng|doanh số|chấm điểm/.test(t))refuse('xếp hạng hay chấm điểm','Khách đọc so với chính họ kỳ trước. Doanh số không phải thước của nhà.','A · Nói vì bạn','đưa danh sách khách có kim sáng, chia theo người nhận, không thứ tự.');
    else if(/chào bán|mã cổ phiếu|mua mã|khuyên mua|dự phóng/.test(t))refuse('gợi ý mã, dự phóng lãi, chào bán','Kế hoạch Dinvest là nháp cho CA, khách tự đặt. Chạm ranh tư vấn đầu tư nên chờ Pháp chế.','N · Nhu cầu và nuôi dưỡng','soạn tờ đọc lại kế hoạch từ đích khách tự đặt.');
    else if(/nhắn tin|gửi tin|gọi khách|liên lạc|đặt lịch/.test(t))refuse('liên lạc khách','CA và người đồng hành là người nói chuyện với khách.','C · Đồng hành','soạn bản nháp để CA đọc, sửa và tự gửi.');
    else if(/điền hộ|điền giúp|đặt đích|nói thay/.test(t))refuse('điền hộ hay nói thay khách','Hồ sơ năm nếp đọc bằng lời khách kể.','E · Trao quyền','đưa câu hỏi mở để mời khách tự kể.');
    else if(/chuẩn bị|tờ đọc lại/.test(t)){
      var has=room(k).msgs.some(function(m){return m.card&&/Tờ đọc lại/.test(m.card.t)&&m.card.st==='open'});
      if(has)rpost(k,{s:'ag',x:'Tờ đọc lại đang chờ bạn ở trên. Đọc rồi quyết giúp mình.'});
      else rpost(k,{s:'ag',x:'Mình đã chuẩn bị xong. Ước tính 3 credit.',card:prepCard(k)});
    }
    else if(/tóm tắt|lời khách/.test(t)){
      var q=NE.filter(function(x){return k.ne[x.k]}).map(function(x){return x.k+' '+k.ne[x.k]}).join('\n');
      rpost(k,{s:'ag',card:{t:'Lời khách nguyên văn · '+k.id,b:q||'Khách chưa kể phần nào bằng lời của mình. Mình không đoán.',checks:[['Giữ nguyên văn','ok']],st:'done',refuse:1}});
    }
    else if(/bàn giao/.test(t))rpost(k,{s:'ag',x:'Mình mở màn Bàn giao cho bạn.',link:['Mở Bàn giao','ban-giao']});
    else rpost(k,{s:'ag',x:'Mình hiểu vài lệnh: chuẩn bị buổi, tóm tắt lời khách, bàn giao. Thử bảo mình xếp hạng khách để xem lan can.'});
  }
  document.addEventListener('submit',function(e){
    if(e.target.id!=='roomForm')return;e.preventDefault();
    var inp=$('#roomInp'),v=inp.value.trim(),k=cur();if(!v||!k)return;
    if(ro()){toast('Vai Kiểm toán: chỉ xem, không nhắn trong phòng.');return}
    inp.value='';rpost(k,{s:'p',n:'Hà Trần',x:v});
    if(/@trợ lý|@tl\b|@agent/i.test(v))setTimeout(function(){agentReply(k,v)},350);
    else{var hp=room(k).members.filter(function(m){return m[0]==='hp'});if(hp.length&&/\?/.test(v)){var h=hp[hp.length-1];setTimeout(function(){rpost(k,{s:'p',n:h[1],x:HELPR[h[2]]||'Mình đã xem. (phản hồi mẫu)'})},700)}}
  });
  document.addEventListener('click',function(e){
    var k=cur();
    if(e.target.closest('#inviteBtn')){
      if(ro())return;var v=$('#inviteSel').value;if(!v||!k){toast('Chọn chỗ đang vướng để mời đúng người.');return}
      var h=HELPN[v],r=room(k);if(r.members.some(function(m){return m[1]===h[0]})){toast('Người này đã ở trong phòng.');return}
      r.members.push(['hp',h[0],h[1]]);rpost(k,{s:'sys',x:h[0]+' ('+h[1]+', mẫu) được mời vào phòng.'});
      pushLog({t:'Vừa xong',a:'human',n:'Hà Trần',ev:'—',what:'Mời '+h[0]+' vào phòng '+k.id,src:'Chỗ vướng: '+v,cost:0,st:'Đã mời',cls:'ok',steps:[['Thao tác','iLink: chọn chỗ vướng, mời đúng người đỡ']]});
      $('#inviteSel').value='';return}
    var ok=e.target.closest('[data-rok]'),no=e.target.closest('[data-rno]');
    if((ok||no)&&k){if(ro())return;var m=room(k).msgs[+(ok||no).dataset[ok?'rok':'rno']];m.card.st=ok?'done':'dropped';
      rpost(k,{s:'sys',x:'Hà Trần '+(ok?'đã đọc và dùng':'đã bỏ')+': '+m.card.t});
      pushLog({t:'Vừa xong',a:'human',n:'Hà Trần',ev:'—',what:'CA '+(ok?'quyết dùng':'bỏ')+': '+m.card.t,src:'Phòng '+k.id,cost:ok?3:0,st:ok?'CA đã quyết':'Đã bỏ',cls:ok?'ok':'gray',steps:[['Thao tác','CA đọc thẻ trong phòng và '+(ok?'chọn dùng':'bỏ')]]});
      renderRoom();return}
    if(e.target.closest('#prepBtn')&&k){var hasOpen=room(k).msgs.some(function(x){return x.card&&/Tờ đọc lại/.test(x.card.t)&&x.card.st==='open'});
      if(!hasOpen)rpost(k,{s:'ag',x:'Mình đã chuẩn bị xong theo yêu cầu của bạn. Ước tính 3 credit.',card:prepCard(k)});
      document.body.classList.add('chat-open');return}
    var sb=e.target.closest('#roomSug button');if(sb){$('#roomInp').value=sb.textContent;$('#roomForm').dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}))}
  });
  document.addEventListener('change',function(e){
    var t=e.target;if(t.dataset.lf===undefined)return;var k=cur(),f=fieldsOf(k)[+t.dataset.lf];
    if(ro()){t.value=f.v;return}
    var old=f.v;f.v=t.value;rpost(k,{s:'sys',x:'Hà Trần sửa «'+f.k+'»: '+(old||'(trống)')+' → '+(f.v||'(trống)')});
    pushLog({t:'Vừa xong',a:'human',n:'Hà Trần',ev:'—',what:'Sửa «'+f.k+'» của '+k.id,src:'Hồ sơ sống',cost:0,st:'Đã lưu',cls:'ok',steps:[['Trước',old||'(trống)'],['Sau',f.v||'(trống)']]});toast('Đã lưu. Phòng đã thấy thay đổi.');
  });
  state.ctab='ho-so';
  function tabsHtml(){return '<div class="filters" style="margin-bottom:12px"><button class="chip" data-ct="ho-so" aria-pressed="'+(state.ctab==='ho-so')+'">Hồ sơ</button><button class="chip" data-ct="la-ban" aria-pressed="'+(state.ctab==='la-ban')+'">La bàn</button><button class="chip" data-ct="sau-buoi" aria-pressed="'+(state.ctab==='sau-buoi')+'">Sau buổi gặp</button></div>'}
  function renderRoomNav(){
    var h='<div class="nav-g">Phòng khách</div>'+khach.filter(function(x){return x.goi==='DCA'}).map(function(x){
      var r=room(x),open=r.msgs.filter(function(m){return m.card&&m.card.st==='open'}).length+threads.filter(function(t){return t.kid===x.id&&t.st==='needs'}).length;
      var on=state.view==='ngoi-cung'&&state.kid===x.id;
      return '<button data-open="'+x.id+'"'+(on?' aria-current="page"':'')+'><span style="width:16px;text-align:center;opacity:.7">#</span>'+esc(x.id)+' '+esc(x.name.split(' ').slice(-1)[0])+(open?'<span class="pill num">'+open+'</span>':'')+'</button>'}).join('');
    $('#roomNav').innerHTML=h;
  }
  document.addEventListener('click',function(e){var ct=e.target.closest('[data-ct]');if(ct){state.ctab=ct.dataset.ct;rerender()}});
  var GL=[['Nhà nghề','Chỗ CA làm nghề đồng hành. Không phải chỗ bán hàng.'],
    ['Bốn kim với khách (Dcompass)','Dgo: mời khách nói lại đích bằng lời của họ. Dinvest: cùng khách đặt nhịp góp và kế hoạch. Dcare: đứng cạnh khách đúng lúc, nhất là khi khó. Dvalues: cùng khách đọc lại kết quả theo kỳ. Mỗi lúc chỉ một kim sáng.'],
    ['Bốn kim tự soi (iCompass)','iGo: tôi là ai trong nghề. iWork: tôi đi đường nào, với khách nào. iLink: ai nối tôi. iValues: tôi ở đâu so với đích.'],
    ['Năm mục của khách (VNDGO)','V Trà Việt: điều coi trọng. N La Bàn: nền và nhu cầu. D Soi Sáng: kỷ luật. G Tích Năng Lực: mục tiêu. O Sống Đầu Tư: kết quả.'],
    ['Ba chặng đồng hành','Be-on: mới đón vào. Be-in: đang đồng hành. Be-out: rời hoặc ngủ. Thứ tự ba việc Dưỡng · Dẫn · Dụng của từng chặng: nghĩa từng chữ là ô chờ, sẽ bổ sung từ tờ gốc.'],
    ['Ba cách đi cùng','DA: tự chủ trên nền số. DCA: có chuyên viên đồng hành. DMA: qua doanh nghiệp hoặc đối tác.'],
    ['Tám chữ VNDCARE','V giá trị và tầm nhìn · N nhu cầu và nuôi dưỡng · D ước mơ và kỷ luật · C đồng hành · A nói vì bạn · R trách nhiệm · E trao quyền · S phụng sự. Đây là tám điều nhà hứa với khách.'],
    ['Gia tài nghề','KMS: tra cứu. LMS: học. DPS: đứng lên. CBK: dùng lại.'],
    ['Nguồn dữ liệu','CMS: hồ sơ khách. AMS: giá trị khách đang giữ. TMS: dấu vết góp, buổi gặp, dấu vết chăm. OMS: kế hoạch đang chạy. PMS: sản phẩm khách đủ điều kiện. iMS: CA đi cùng khách. CU_BIS: bảng số chung cho mọi màn.'],
    ['Lượt AI','Mỗi lần máy chuẩn bị một bản tốn một ít lượt. Có hạn mức theo tháng.']];
  var gl=$('#gloss');
  gl.innerHTML='<div class="box" role="dialog" aria-label="Từ điển nhà"><div class="ph"><h2 style="margin:0;font-size:16px">Từ điển nhà</h2><span class="sp"></span><button class="btn sm" id="glossX" type="button">Đóng</button></div><p class="src" style="margin:0">Giải nghĩa ngắn các từ của nhà. Từ nào chưa rõ nghĩa được ghi là ô chờ.</p>'+GL.map(function(g){return '<div class="metric"><b>'+g[0]+'</b><span style="font-size:13px">'+g[1]+'</span></div>'}).join('')+'</div>';
  $('#glossBtn').onclick=function(){gl.hidden=false};
  gl.addEventListener('click',function(e){if(e.target===gl||e.target.id==='glossX')gl.hidden=true});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')gl.hidden=true});
  setK('K-0412');route();
  add('bot','Chào Hà. Sáng nay mình đã chuẩn bị tóm tắt sáng cho ba khách và soạn sẵn hai bản nháp. Mình chuẩn bị, bạn nói chuyện với khách. Gặp từ lạ, bấm Từ điển ở góc trên.');
})();
</script>
