<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>VNDCARE Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: một khung chat kiểu Slack làm nền. Thanh bên trái = nơi đi (la bàn, hộp chăm, không gian, phòng khách). Giữa = làm việc. Phải = hồ sơ sống của phòng. */
:root{
  --bg:#F4F4F5; --panel:#FFFFFF; --panel-2:#FAFAFA; --fg:#18181B; --muted:#71717A; --line:#E4E4E7;
  --primary:#2563EB; --primary-h:#1D4ED8; --primary-soft:#EFF6FF; --primary-ink:#1E40AF;
  --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#D97706; --warn-soft:#FEF3C7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --agent:#7C3AED; --agent-soft:#F3E8FF; --ring:rgba(37,99,235,.28); --shadow:0 8px 24px rgba(0,0,0,.12);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090B; --panel:#131316; --panel-2:#18181C; --fg:#F4F4F5; --muted:#A1A1AA; --line:#27272A;
  --primary:#3B82F6; --primary-h:#60A5FA; --primary-soft:#172554; --primary-ink:#BFDBFE;
  --ok:#4ADE80; --ok-soft:#052E16; --warn:#FBBF24; --warn-soft:#3B2A05; --bad:#F87171; --bad-soft:#3F1010;
  --agent:#A78BFA; --agent-soft:#2E1065; --ring:rgba(96,165,250,.35); --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090B; --panel:#131316; --panel-2:#18181C; --fg:#F4F4F5; --muted:#A1A1AA; --line:#27272A;
  --primary:#3B82F6; --primary-h:#60A5FA; --primary-soft:#172554; --primary-ink:#BFDBFE;
  --ok:#4ADE80; --ok-soft:#052E16; --warn:#FBBF24; --warn-soft:#3B2A05; --bad:#F87171; --bad-soft:#3F1010;
  --agent:#A78BFA; --agent-soft:#2E1065; --ring:rgba(96,165,250,.35); --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;box-shadow:0 0 0 4px var(--ring)}
.num{font-variant-numeric:tabular-nums}
body.audit .act{pointer-events:none;opacity:.45}

.app{display:grid;grid-template-columns:264px minmax(0,1fr);height:calc(100dvh - 32px);min-height:680px;max-width:1760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}

/* Thanh bên */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:2px;background:var(--panel-2);min-width:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px;font-weight:600;font-size:15px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.nav-g{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;background:transparent;border-radius:6px;color:var(--muted);font-weight:500;text-align:left;transition:background 150ms ease-out;white-space:nowrap;overflow:hidden}
.nav button:hover{background:var(--line);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary-ink)}
.nav .ic{width:16px;text-align:center;opacity:.75;flex:none}
.pill{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:8px}
.sel{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 8px;max-width:100%}
.av{width:28px;height:28px;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.av.ag{background:var(--agent-soft);color:var(--agent)}

/* Khung chính */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line)}
.top h1{font-size:16px;font-weight:600;margin:0;white-space:nowrap}
.top .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.btn.menu-btn{display:none}
.body{flex:1;min-height:0;position:relative}
.view{display:none;height:100%}
.view.on{display:block}
.page{overflow:auto;padding:24px}
.ro-banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:16px;font-weight:500}
.ro-banner[hidden]{display:none}

.btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background 150ms ease-out;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lead{margin:0 0 16px;color:var(--muted);max-width:720px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.soft{background:var(--primary-soft);border-color:transparent}
.panel h2,.panel h3{margin:0;font-size:14px;font-weight:600}
.panel p{margin:0;color:var(--muted);font-size:13px}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph .sp{flex:1}
.sec-h{margin:24px 0 12px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sec-h:first-child{margin-top:0}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--primary-soft);color:var(--primary-ink);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.ag{background:var(--agent-soft);color:var(--agent)}
.badge.gray{background:var(--line);color:var(--muted)}
.lock{color:var(--muted);font-size:12px;display:inline-flex;gap:4px;align-items:center}
.src{font-size:12px;color:var(--muted)}
.lnk{border:0;background:transparent;color:var(--primary);padding:0;font-size:13px;text-align:left}
.lnk:hover{text-decoration:underline}
.quote{border-left:3px solid var(--primary);padding:6px 12px;background:var(--panel-2);border-radius:0 6px 6px 0;font-size:13px}
.quote.empty{border-left-color:var(--line);color:var(--muted)}
.kims{display:flex;gap:6px;flex-wrap:wrap}
.kim{height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:500;display:inline-flex;align-items:center;background:var(--panel)}
.kim.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 3px var(--ring)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:500;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink);border-color:var(--primary)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tw{border:1px solid var(--line);border-radius:8px;overflow:auto;background:var(--panel)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:0 12px;height:34px;background:var(--panel-2);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
code{font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:32px;text-align:center;color:var(--muted)}
.gate{border:1px dashed var(--line);border-radius:8px;padding:12px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}
.metric{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.metric:first-of-type{border-top:0}
.metric .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.how{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:8px}
.how[hidden]{display:none}
.tile{border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:2px}
button.tile:hover{border-color:var(--primary)}
.tile b{font-size:24px;font-weight:600;line-height:1.2}
.tile span{color:var(--muted);font-size:12px}
.klist{display:flex;flex-direction:column;gap:6px}
.krow{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.krow:hover{border-color:var(--primary)}
.krow .t{font-weight:600}
.tgl{display:flex;align-items:center;gap:8px;font-size:13px}
.tgl input{width:16px;height:16px;accent-color:var(--primary)}

/* Hộp chăm */
.two{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px}
.li{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.li:hover{border-color:var(--primary)}
.li[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.li .t{font-weight:600}
.li .s{color:var(--muted);font-size:12px}
.li .r{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.detail{border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
.d-h{display:flex;gap:10px;align-items:center;padding:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.d-h .t{font-weight:600;min-width:0}
.d-h .sp{flex:1}
.d-b{padding:16px;display:flex;flex-direction:column;gap:16px}
.d-b h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.d-f{display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap;align-items:center}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--primary-soft);border-color:transparent}
.convo{display:flex;flex-direction:column;gap:8px}
.draft{width:100%;min-height:110px;border:1px solid var(--agent);border-radius:6px;background:var(--agent-soft);padding:12px;line-height:1.55;font-size:13px;resize:vertical}
.checks{display:flex;gap:6px;flex-wrap:wrap}

/* Phòng (Slack) */
#v-phong.on{display:grid;grid-template-columns:minmax(0,1fr) 400px}
#v-phong.no-canvas{grid-template-columns:minmax(0,1fr)}
#v-phong.no-canvas .canvas{display:none}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.r-h{padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;gap:8px}
.r-h b{font-size:15px}
.mem{display:flex;gap:6px;flex-wrap:wrap}
.invite{display:flex;gap:6px;max-width:520px}
.invite select{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 6px;font-size:12px}
.msgs{flex:1;min-height:0;overflow:auto;padding:16px 24px;display:flex;flex-direction:column;gap:14px}
.rsys{text-align:center;font-size:12px;color:var(--muted);padding:2px 8px}
.rm{display:flex;gap:10px;align-items:flex-start}
.rm .body{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.rm .tx{overflow-wrap:anywhere}
.rcard{border:1px solid var(--agent);background:var(--agent-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px;max-width:640px}
.rcard.refuse{border-color:var(--warn);background:var(--warn-soft)}
.rcard.plain{border-color:var(--line);background:var(--panel)}
.rcard .bd{white-space:pre-line;overflow-wrap:anywhere}
.rcard form{display:flex;gap:6px}
.rcard input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--panel)}
.row-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 24px 8px}
.sug button{height:36px;padding:0 14px;font-weight:500;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px}
.sug button:hover{border-color:var(--primary);background:var(--primary-soft)}
.compose{display:flex;gap:8px;padding:12px 24px 16px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:6px;padding:0 12px;background:var(--panel)}
.canvas{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--panel)}
.rail{display:grid;grid-template-columns:1fr;gap:6px}
.ne{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ne b{font-size:13px}
.ne span{font-size:12px;color:var(--muted)}
.ne[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--ring)}
.ne.done b{color:var(--ok)}
.tl{display:flex;flex-direction:column;gap:10px}
.tl .e{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;font-size:13px}
.tl .d{color:var(--muted);font-size:12px}
.fin{height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--panel);width:100%}
.canvas-btn{display:none}

/* Không gian */
.kg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.vlist{display:flex;flex-direction:column;gap:4px}
.vlist .nav-g{padding:8px 4px 2px}
.vlist button{height:32px;padding:0 10px;border:0;background:transparent;border-radius:6px;text-align:left;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.vlist button:hover{background:var(--panel-2);color:var(--fg)}
.vlist button[aria-current="true"]{background:var(--primary-soft);color:var(--primary-ink)}
.builder{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.builder label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;height:34px;border:1px solid var(--agent);border-radius:6px;padding:0 10px;background:var(--agent-soft)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol h3{margin:4px 6px;font-size:13px;font-weight:600;display:flex;justify-content:space-between}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-weight:500;z-index:60;max-width:90vw}
.toast[hidden]{display:none}
.gloss{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.gloss[hidden]{display:none}
.gloss .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:640px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px}

@media (max-width:1180px){
  #v-phong.on{grid-template-columns:minmax(0,1fr)}
  .canvas{display:none}
  .canvas.show{display:flex;position:absolute;inset:0;z-index:5}
  .canvas-btn{display:inline-flex}
  .two{grid-template-columns:1fr}
  .kg{grid-template-columns:1fr}
}
@media (max-width:820px){
  body{padding-block:8px}
  .app{grid-template-columns:1fr;height:calc(100dvh - 16px);min-height:0}
  .side{position:absolute;left:0;top:0;bottom:0;width:264px;z-index:30;transform:translateX(-100%);transition:transform 150ms ease-out;box-shadow:var(--shadow)}
  body.side-open .side{transform:none}
  .btn.menu-btn{display:inline-flex}
  .top{padding:0 16px}.top .sub{display:none}
  .page{padding:16px}
  .r-h,.msgs{padding-left:16px;padding-right:16px}.sug,.compose{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#v-phong{position:relative;grid-template-columns:minmax(0,1fr)!important}
.canvas{display:none}
.canvas.show{display:flex;position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);z-index:5;box-shadow:-8px 0 24px rgba(0,0,0,.12);border-left:1px solid var(--line)}
.canvas-btn{display:inline-flex}.canvas-btn[hidden]{display:none!important}
#chanNav{display:none}
.mem-d{padding:2px 0 6px;font-size:12px;color:var(--muted)}.mem-d summary{cursor:pointer}
</style>
</head>
<body>


<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></div><span>VNDCARE</span></div>
    <nav class="nav" id="nav" aria-label="Điều hướng"></nav>
    <nav class="nav" id="roomNav" aria-label="Phòng khách"></nav>
    <nav class="nav" id="chanNav" aria-label="Kênh"></nav>
    <div class="side-foot">
      <label for="role">Xem với vai trò</label>
      <select id="role" class="sel"><option value="ca">CA · Hà Trần</option><option value="audit">Kiểm toán (chỉ xem)</option></select>
      <button class="lnk" data-go="cai-dat" type="button">Cài đặt</button><button class="lnk" data-go="cho-doc" type="button">Mọi bản máy chờ đọc</button>
      <span>Dữ liệu mẫu. Khách chỉ là mã trên công cụ của CA.</span>
    </div>
  </aside>

  <section class="main">
    <header class="top">
      <button class="btn menu-btn" id="menuBtn" type="button" aria-label="Mở thanh bên">Menu</button>
      <h1 id="title"></h1><span class="sub" id="subtitle"></span>
      <span class="sp"></span>
      <button class="btn canvas-btn" id="canvasBtn" type="button">Hồ sơ</button>
      <button class="btn" id="glossBtn" type="button">Từ điển</button>
    </header>
    <div class="body">
      <div class="view page" id="v-dashboard"></div>
      <div class="view page" id="v-hop-cham"></div>

    +'<div class="grid g2" style="margin-top:12px">'+met('khach','Khách của tôi lớn lên','Mỗi khách so với chính họ kỳ trước.')+met('nghe','Nghề của tôi lớn lên','Người làm nghề xem được cách con số của mình được tính. Doanh số không phải thước chính.')+'</div></details>'
    +(pins?'<div class="sec-h">Ghim từ Khách</div><div class="grid g2">'+pins+'</div>':'');
  }

  /* ================= Hộp chăm ================= */
  var CHS=['Zalo','Hotline','Email','App Dcare'];
  function vHop(){
    var f=state.hopF,ch=state.hopCh;
    var list=threads.filter(function(t){return (f==='all'||(f==='needs'?t.st==='needs':f==='mine'?t.own==='me':t.own==='team'))&&(ch==='all'||t.ch===ch)});

    +'<div class="filters">'+chip('hf','all','Tất cả')+chip('hf','needs','Chưa trả lời ('+threads.filter(function(t){return t.st==='needs'}).length+')')+chip('hf','mine','Của tôi')+chip('hf','team','Đội chăm số')+'<span class="src" style="margin:0 4px">Kênh:</span>'+chip('hc','all','Tất cả')+CHS.map(function(c){return chip('hc',c,c+' ('+threads.filter(function(t){return t.ch===c}).length+')')}).join('')+'</div>'
    +'<div class="two"><div class="list">'+(list.map(function(t){var k=K(t.kid),s=t.st==='needs'?['Chờ CA','warn']:t.st==='done'?['Đã trả lời','ok']:['Đội chăm số giữ','gray'];return '<button class="li" data-th="'+t.id+'" aria-pressed="'+(t.id===state.hopSel)+'"><span class="r"><span class="t">'+esc(k.id)+' · '+esc(k.name)+'</span><span class="s">'+t.time+'</span></span><span class="s">'+t.ch+' · '+esc(t.msgs[0][1]).slice(0,56)+(t.msgs[0][1].length>56?'…':'')+'</span><span class="r"><span class="badge '+s[1]+'">'+s[0]+'</span>'+(t.ev?'<span class="badge warn">'+esc(t.ev)+'</span>':'')+'</span></button>'}).join('')||'<div class="empty">Không có tin nào.</div>')+'</div><div class="detail">'+(sel?thread(sel):'<div class="empty" style="border:0">Chọn một tin.</div>')+'</div></div>';

  function thread(t){

    else body='<div><h4>Bản máy soạn cho CA</h4><textarea class="draft" id="draft" aria-label="Bản nháp"'+(t.st==='done'?' readonly':'')+'>'+esc(t.draft)+'</textarea></div><div class="checks">'+t.checks.map(function(c){return '<span class="badge '+c[1]+'">✓ '+esc(c[0])+'</span>'}).join('')+'</div>';

  function rows(cfg){
    var r=cfg.obj==='khach'?khach.map(function(k){return {id:k.id,name:k.name,goi:k.goi,stage:STAGE[k.st][0].split(' · ')[0],kim:k.kim,nep:NE.filter(function(n){return n.k===k.neLit})[0].k+' · '+NE.filter(function(n){return n.k===k.neLit})[0].n,ev:k.ev,due:k.due,ch:k.ch,last:k.last,_dca:k.goi==='DCA',_today:/Hôm nay/.test(k.due),_ev:!!k.ev}}):tickets.map(function(t){var k=K(t.kid);return {id:t.id,kid:t.kid+' · '+k.name.split(' ').slice(-1)[0],title:t.title,kim:t.kim,nep:t.nep,ch:t.ch,st:t.st,due:t.due,_needs:t.st==='Chờ CA',_today:t.due==='Hôm nay'}});

    return gs.map(function(g){var xs=rs.filter(function(x){return x[cfg.group]===g});

  /* ================= Lệnh, trợ lý, sự kiện ================= */
  function prepCard(k){return {t:'Tờ đọc lại kế hoạch · '+k.id,st:'open',checks:[['Lời khách nguyên văn','ok'],['Không xếp hạng khách','ok'],['Không mã, không dự phóng lãi','ok']],b:'Đích khách tự đặt: '+(k.ne.V||'chưa có')+'\nKim đang lệch: '+k.kim+'. '+k.ev+'.\nBa câu hỏi mở: (1) Điều gì làm anh/chị lo nhất lúc này? (2) Nguyên tắc anh/chị tự đặt còn đúng không? (3) Anh/chị muốn mình ở cạnh thế nào?\nSố liệu và tiến độ: ô chờ, đọc từ CU_BIS khi nối hệ thống.'}}
  function refuse(id,a,why,nep,inst){post(id,{s:'ag',card:{refuse:1,t:'Mình không làm việc này: '+a,b:why+'\nNếp: '+nep+'\nThay vào đó: '+inst}})}
  function agentReply(id,txt){
    var t=txt.toLowerCase(),k=K(id);
    if(/xếp hạng|doanh số|chấm điểm/.test(t))refuse(id,'xếp hạng hay chấm điểm','Khách đọc so với chính họ kỳ trước. Doanh số không phải thước của nhà.','A · Nói vì bạn','đưa danh sách khách có kim sáng, chia theo người nhận, không thứ tự.');
    else if(/chào bán|mã cổ phiếu|mua mã|khuyên mua|dự phóng/.test(t))refuse(id,'gợi ý mã, dự phóng lãi, chào bán','Kế hoạch Dinvest là nháp cho CA, khách tự đặt. Chạm ranh tư vấn đầu tư nên chờ Pháp chế.','N · Nhu cầu và nuôi dưỡng','soạn tờ đọc lại kế hoạch từ đích khách tự đặt.');
    else if(/nhắn tin|gửi tin|gọi khách|liên lạc|đặt lịch/.test(t))refuse(id,'liên lạc khách','CA và người đồng hành là người nói chuyện với khách.','C · Đồng hành','soạn bản nháp để CA đọc, sửa và tự gửi trong Hộp chăm.');
    else if(/điền hộ|điền giúp|đặt đích|nói thay/.test(t))refuse(id,'điền hộ hay nói thay khách','Hồ sơ năm nếp đọc bằng lời khách kể.','E · Trao quyền','đưa câu hỏi mở để mời khách tự kể.');
    else if(!k){var open=allOpen(),need=threads.filter(function(x){return x.st==='needs'}).length;post(id,{s:'ag',x:'Hôm nay có '+need+' tin khách chưa trả lời và '+open+' bản máy chờ bạn đọc. Mình chuẩn bị, bạn nói chuyện với khách.',link:['Mở Chờ tôi đọc','cho-doc']})}
    else if(/chuẩn bị|tờ đọc lại/.test(t))runCmd(id,'/chuanbi');
    else if(/tóm tắt|lời khách/.test(t))runCmd(id,'/tomtat');
    else if(/bàn giao/.test(t))runCmd(id,'/bangiao');
    else post(id,{s:'ag',x:'Mình hiểu vài lệnh: /chuanbi, /tomtat, /ketthuc, /bangiao. Thử bảo mình xếp hạng khách để xem lan can.'});
  }
  function runCmd(id,cmd){
    var k=K(id);cmd=cmd.trim().split(/\s+/)[0].toLowerCase();
    if(cmd==='/tudien'){$('#gloss').hidden=false;return}
    if(!k){post(id,{s:'ag',x:'Lệnh này dùng trong phòng của một khách.'});return}
    if(cmd==='/chuanbi'){var has=R(id).msgs.some(function(m){return m.card&&/Tờ đọc lại/.test(m.card.t)&&m.card.st==='open'});if(has)post(id,{s:'ag',x:'Tờ đọc lại đang chờ bạn ở trên. Đọc rồi quyết giúp mình.'});else post(id,{s:'ag',x:'Mình đã chuẩn bị xong. Ước tính 3 credit.',card:prepCard(k)})}
    else if(cmd==='/tomtat'){var q=NE.filter(function(x){return k.ne[x.k]}).map(function(x){return x.k+' '+k.ne[x.k]}).join('\n');post(id,{s:'ag',card:{t:'Lời khách nguyên văn · '+k.id,b:q||'Khách chưa kể phần nào bằng lời của mình. Mình không đoán.',checks:[['Giữ nguyên văn','ok']],st:'done',noact:1}})}
    else if(cmd==='/ketthuc')post(id,{s:'ag',x:'Cảm ơn bạn. Trước khi ghi sổ, mình soi cùng bạn một lượt.',card:{kind:'letters',t:'Nhìn lại sau buổi gặp · tám chữ VNDCARE',letters:{},st:'open'}});
    else if(cmd==='/bangiao')post(id,{s:'ag',x:'Mình mở bàn giao cho '+k.id+'. Phòng ở lại, người mới đọc lại được toàn bộ.',card:{kind:'hand',t:'Bàn giao '+k.id,ticks:HAND.map(function(){return false}),st:'open'}});
    else if(cmd==='/thuoc'){state.ctab='thuoc';post(id,{s:'ag',x:'Mình mở tab Thước bên phải. Khách đọc so với chính họ, không so với khách khác.'})}
    else post(id,{s:'ag',x:'Mình chưa có lệnh '+cmd+'. Có: '+Object.keys(CMDS).join(' ')+'.'});
  }

      if(/@trợ lý|@tl\b|@agent/i.test(v))setTimeout(function(){agentReply(state.room,v)},350);
      else if(K(state.room)){var hp=R(state.room).members.filter(function(m){return m[0]==='hp'});if(hp.length&&/\?/.test(v)){var h=hp[hp.length-1];setTimeout(function(){post(state.room,{s:'p',n:h[1],x:HELPR[h[2]]||'Mình đã xem. (phản hồi mẫu)'})},700)}}
      return}
    if(f.dataset.nask){e.preventDefault();var q=f.querySelector('input').value.trim();if(!q)return;NOTES.filter(function(n){return n.id===f.dataset.nask})[0].asks.push('Bạn hỏi: '+q+' (nhà sẽ trả lời tại đây)');toast('Đã gửi câu hỏi cho nhà.');refresh()}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#gloss').hidden=true});

    ['Năm mục của khách (VNDGO)','V Trà Việt: điều coi trọng. N La Bàn: nền và nhu cầu. D Soi Sáng: kỷ luật. G Tích Năng Lực: mục tiêu. O Sống Đầu Tư: kết quả.'],
    ['Ba chặng đồng hành','Be-on: mới đón vào. Be-in: đang đồng hành. Be-out: rời hoặc ngủ. Thứ tự ba việc Dưỡng · Dẫn · Dụng của từng chặng: nghĩa từng chữ là ô chờ, sẽ bổ sung từ tờ gốc.'],
    ['Ba cách đi cùng','DA: tự chủ trên nền số. DCA: có chuyên viên đồng hành. DMA: qua doanh nghiệp hoặc đối tác.'],
    ['Tám chữ VNDCARE','V giá trị và tầm nhìn · N nhu cầu và nuôi dưỡng · D ước mơ và kỷ luật · C đồng hành · A nói vì bạn · R trách nhiệm · E trao quyền · S phụng sự. Là tám điều nhà hứa với khách.'],
    ['Nguồn dữ liệu','CMS: hồ sơ khách. AMS: giá trị khách đang giữ. TMS: dấu vết góp, buổi gặp, dấu vết chăm. OMS: kế hoạch đang chạy. PMS: sản phẩm khách đủ điều kiện. iMS: CA đi cùng khách. CU_BIS: bảng số chung cho mọi màn.'],
    ['Lệnh trong phòng','/chuanbi: tờ đọc lại kế hoạch. /tomtat: lời khách nguyên văn. /ketthuc: nhìn lại sau buổi gặp. /bangiao: bàn giao khách. /thuoc: tab Thước. /tudien: mở từ điển này.']];
  $('#gloss').innerHTML='<div class="box" role="dialog" aria-label="Từ điển nhà"><div class="ph"><h2 style="margin:0;font-size:16px">Từ điển nhà</h2><span class="sp"></span><button class="btn sm" id="glossX" type="button">Đóng</button></div><p class="src" style="margin:0">Giải nghĩa ngắn các từ của nhà. Từ nào chưa rõ nghĩa được ghi là ô chờ.</p>'+GL.map(function(g){return '<div class="metric"><b>'+g[0]+'</b><span style="font-size:13px">'+g[1]+'</span></div>'}).join('')+'</div>';
