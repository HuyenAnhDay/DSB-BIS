<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DSB Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: left sidebar (Figma CRM nav) + top toolbar + compass lens bar; content in cards. Figma tokens + compass tokens. */
:root{
  --white:#FFFFFF; --black:#2A2A2A;
  --p100:#F4F3FF; --p200:#DFDEFF; --p300:#4D4AEA;
  --g50:#FCFCFD; --g100:#F9F9FD; --g200:#ECECEE; --g250:#D8D9DD; --g300:#8C8E90; --g400:#57595B; --g600:#475467; --g1000:#2D2E33;
  --ok100:#EAFDEE; --ok200:#147129;
  --warn100:#FFF6E5; --warn200:#9A5B00;
  --bg:#F9F9FD; --surface:#FFFFFF; --fg:#2D2E33; --fg2:#57595B; --fg3:#8C8E90; --line:#ECECEE; --line2:#D8D9DD;
  --shadow:0 2px 4px rgba(0,0,0,.05);
  /* Compass pairs: strong = chiều người (i…), soft = chiều khách (D…) */
  --go:#2E7CF6; --go-soft:#EAF2FE;
  --work:#1E9E57; --work-soft:#E8F7EE;
  --link:#0E8FAE; --link-soft:#E3F5F9;
  --val:#A23BCB; --val-soft:#F6EAFB;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px; --r2:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --p100:#24234A; --p200:#33317A; --p300:#8B89FF;
  --ok100:#12301B; --ok200:#6FD98A; --warn100:#33270F; --warn200:#F2B65A;
  --bg:#141518; --surface:#1C1D21; --fg:#ECECEF; --fg2:#B3B5BA; --fg3:#80838A; --line:#2B2D33; --line2:#3A3C43;
  --shadow:0 2px 4px rgba(0,0,0,.3);
  --go:#6AA6FF; --go-soft:#16243A; --work:#4CCB85; --work-soft:#12291C; --link:#4CC3DE; --link-soft:#0F2830; --val:#CF7CF0; --val-soft:#2A1832;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --p100:#24234A; --p200:#33317A; --p300:#8B89FF;
  --ok100:#12301B; --ok200:#6FD98A; --warn100:#33270F; --warn200:#F2B65A;
  --bg:#141518; --surface:#1C1D21; --fg:#ECECEF; --fg2:#B3B5BA; --fg3:#80838A; --line:#2B2D33; --line2:#3A3C43;
  --shadow:0 2px 4px rgba(0,0,0,.3);
  --go:#6AA6FF; --go-soft:#16243A; --work:#4CCB85; --work-soft:#12291C; --link:#4CC3DE; --link-soft:#0F2830; --val:#CF7CF0; --val-soft:#2A1832;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:20px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--p300);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}

.app{min-height:100%}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:var(--fg);text-decoration:none;flex:none}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--p300);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em}
.brand .bt{display:none}
.nav{display:flex;align-items:center;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--r);color:var(--fg2);text-decoration:none;font-weight:500;white-space:nowrap;position:relative}
.nav a:hover{background:var(--g100);color:var(--fg)}
:root .nav a:hover{background:color-mix(in srgb,var(--fg3) 10%,transparent)}
.nav a.on{background:var(--p100);color:var(--p300)}
.nav a .k{font-size:11px;font-weight:500;color:var(--fg3)}
.nav a.soon{color:var(--fg3)}
.nav a.soon .k{border:1px solid var(--line2);border-radius:999px;padding:0 6px;line-height:16px}
.navsep{width:1px;height:20px;background:var(--line2);margin:0 6px;flex:none}

.dot{width:8px;height:8px;border-radius:50%;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.tools{display:flex;align-items:center;gap:4px}
.tools .search{margin-right:8px}
.tools .btn.pri{margin-left:8px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:var(--r);padding:0 12px;height:40px;width:200px;min-width:0;background:var(--surface);color:var(--fg3)}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1}
/* Icon quen thuộc: nhỏ, không khung — chỉ đổi màu khi hover */
.iconbtn{width:32px;height:32px;border:0;background:transparent;padding:0;display:grid;place-items:center;position:relative;color:var(--fg3);border-radius:50%;text-decoration:none}
.iconbtn .i{width:18px;height:18px}
.iconbtn:hover{color:var(--fg)}
.iconbtn .badge{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--p300);box-shadow:0 0 0 2px var(--surface)}
/* Nút mặc định = chữ, không khung. Chỉ nút chính (pri) mới có nền. */
.btn{text-decoration:none;color:var(--fg2);display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px;border:0;background:transparent;border-radius:6px;font-weight:500;white-space:nowrap}
.btn:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.btn.sec{color:var(--p300);font-weight:600}
.btn.sec:hover{color:var(--p300)}
.btn.pri{height:40px;padding:0 16px;background:var(--p300);color:#fff;border-radius:var(--r)}
.btn.pri:hover{filter:brightness(1.06);text-decoration:none;color:#fff}
.btn.sm{font-size:13px}
.btn.pri.sm{height:32px;padding:0 12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;text-decoration:none}

.lens{padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface)}
.lens .lbl{font-size:12px;color:var(--fg3);margin-right:4px}
.lchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:500;color:var(--fg2)}
.lchip.on{border-color:var(--c);background:var(--cs);color:var(--c)}
.lchip.all.on{border-color:var(--p300);background:var(--p100);color:var(--p300)}
.lchip .pair{font-weight:400;opacity:.8}
.lens .hint{margin-left:auto;font-size:12px;color:var(--fg3)}

.page{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1280px;width:100%}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:28px;line-height:38px;font-weight:600;margin:0;text-wrap:balance}
.ph .sub{color:var(--fg2);margin:0 0 2px}
.ph .acts{margin-left:auto;display:flex;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;align-items:center;gap:8px;padding:16px 20px 12px}
.card>header h2{font-size:16px;line-height:24px;font-weight:600;margin:0}
.card>header .meta{font-size:12px;color:var(--fg3)}
.card>header .r{margin-left:auto}
.card .body{padding:0 20px 20px}
.grid-dash{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.ritual{display:grid;gap:20px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}

/* compass alert */
.calert{display:grid;grid-template-columns:132px minmax(0,1fr);gap:20px;padding:20px;align-items:center}
.calert h2{font-size:20px;line-height:28px;margin:0 0 4px;font-weight:600;text-wrap:balance}
.calert .why{color:var(--fg2);margin:0 0 14px}
.kims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kim{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.kim .nm{font-weight:600;font-size:13px;white-space:nowrap}
.kim .st{font-size:12px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kim.lit{border-color:var(--c);background:var(--cs)}
.kim.lit .nm{color:var(--c)}
.kim.dim{opacity:.72}
.kim .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex:none}
.kim.lit .ic{background:var(--c);color:#fff}

.ask{padding:20px;display:flex;flex-direction:column;gap:12px;height:100%}
.ask .eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.ask q{font-size:18px;line-height:28px;font-weight:500;quotes:none;text-wrap:pretty}
.ask .src{font-size:12px;color:var(--fg3)}
.ask .row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.ask textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;background:var(--surface);resize:vertical}

.task{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.task:first-child{border-top:0}
.task .bar{align-self:stretch;border-radius:4px;background:var(--c)}
.task .t{font-weight:600}
.task .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.task .who a{color:var(--fg);text-decoration:none;font-weight:600}
.task .who a:hover{text-decoration:underline}
.task .why{color:var(--fg2);font-size:13px}
.task .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--cs);color:var(--c);white-space:nowrap}
.tag.ca{background:var(--c);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--g200);color:var(--fg2);white-space:nowrap}
:root .chip{background:color-mix(in srgb,var(--fg3) 16%,transparent)}
.chip.ok{background:var(--ok100);color:var(--ok200)}
.chip.warn{background:var(--warn100);color:var(--warn200)}
.chip.new{background:var(--p100);color:var(--p300)}
.lane>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:16px 20px;cursor:pointer}
.lane>summary::-webkit-details-marker{display:none}
.lane>summary h2{font-size:16px;margin:0;font-weight:600}
.lane>summary .meta{font-size:12px;color:var(--fg3)}
.lane>summary .chev{margin-left:auto;transition:transform .2s;color:var(--fg3)}
.lane[open]>summary .chev{transform:rotate(180deg)}
.lane .list{border-top:1px solid var(--line)}
.empty{padding:20px;color:var(--fg2)}

.retro .bars{display:flex;flex-direction:column;gap:10px}
.rb{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.rb .track{height:8px;border-radius:999px;background:var(--line)}
.rb .fill{height:100%;border-radius:999px;background:var(--c)}
.rb b{color:var(--c);font-weight:600}
.rb span:last-child{text-align:right;color:var(--fg3);font-variant-numeric:tabular-nums}
.retro .note{margin-top:14px;padding:12px;border-radius:var(--r);background:var(--cs);color:var(--fg);font-size:13px}
.retro .note b{color:var(--c)}

.appt{border-top:1px solid var(--line);padding:14px 20px}
.appt:first-of-type{border-top:0}
.appt .tm{font-weight:600;font-variant-numeric:tabular-nums}
.appt .ttl{display:flex;gap:10px;align-items:baseline}
.appt .ttl a{color:var(--fg);font-weight:600;text-decoration:none}
.appt .what{color:var(--fg2);font-size:13px;margin:2px 0 8px 52px}
.prep{margin:0 0 0 52px;padding:12px;border-radius:var(--r);background:var(--g100);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:8px}
:root .prep{background:color-mix(in srgb,var(--fg3) 7%,var(--surface))}
.prep dt{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.prep dd{margin:2px 0 0}
.prep blockquote{margin:2px 0 0;padding-left:10px;border-left:2px solid var(--line2);color:var(--fg)}
.life{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center;font-size:13px}

/* table */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:16px;color:var(--fg3);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--p300);border-bottom-color:var(--p300)}
.tabs button .n{font-size:12px;color:var(--fg3);font-weight:500}
.tabs button.tk.on{color:var(--c);border-bottom-color:var(--c)}
.tabs button .soon{font-size:11px;color:var(--fg3);font-weight:400}
.filters{display:flex;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:12px;font-weight:500;color:var(--fg2);text-align:left;padding:12px 16px;background:var(--g100);border-bottom:1px solid var(--line);white-space:nowrap}
:root th{background:color-mix(in srgb,var(--fg3) 7%,var(--surface))}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--p300) 4%,transparent)}
.cl{display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--p100);color:var(--p300);flex:none}
.cl small{display:block;color:var(--fg3);font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* profile */
.prof-head{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px}
.prof-id{display:flex;gap:16px;align-items:flex-start}
.prof-id .av{width:56px;height:56px;font-size:18px}
.prof-id h1{margin:0;font-size:24px;line-height:32px;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px;color:var(--fg2);font-size:13px}
.facts b{color:var(--fg);font-weight:500}
.star{border-radius:var(--r2);padding:16px;background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.star .eyebrow{font-size:12px;font-weight:600;color:var(--c);display:flex;gap:6px;align-items:center}
.star p{margin:6px 0 12px;font-weight:500}
.sec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;font-size:13px}
.kv dt{color:var(--fg3)}
.kv dd{margin:0}
.twin{width:100%;border-collapse:collapse;min-width:0}
.twin th,.twin td{padding:10px 12px;font-size:13px;vertical-align:top}
.twin td:first-child{color:var(--fg3);width:28%}
.twin td.voice{font-style:italic}
.note-line{font-size:12px;color:var(--fg3);margin-top:10px}
.people{display:flex;flex-direction:column}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .role{font-size:12px;color:var(--fg3)}
.person .r{margin-left:auto}
.grp{font-size:12px;font-weight:600;color:var(--fg2);margin:4px 0 2px;letter-spacing:.03em;text-transform:uppercase}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:12px 0;position:relative}
.tli .ch{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--g100);border:1px solid var(--line);color:var(--fg2)}
.tli .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli .h b{font-weight:600}
.tli .h .d{color:var(--fg3);font-size:12px}
.tli p{margin:4px 0 0;color:var(--fg2);font-size:13px}
.tli blockquote{margin:6px 0 0;padding-left:10px;border-left:2px solid var(--line2);font-size:13px}
.soonbox{padding:40px 20px;text-align:center;color:var(--fg2)}
.soonbox h2{font-size:18px;margin:12px 0 6px;color:var(--fg)}
.soonbox p{max-width:440px;margin:0 auto}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(16,17,20,.4);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:31;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;gap:8px;padding:20px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:18px;font-weight:600}
.drawer form{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-size:13px;font-weight:500;color:var(--fg2)}
.fld .hint{font-size:12px;color:var(--fg3)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;background:var(--surface);width:100%}
.fld textarea{min-height:76px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line2);border-radius:var(--r);font-size:13px;cursor:pointer}
.seg input{accent-color:var(--p300)}
.seg label:has(input:checked){border-color:var(--p300);background:var(--p100);color:var(--p300)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.chk input{margin-top:3px;accent-color:var(--p300)}
.drawer footer{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g1000);color:#fff;padding:12px 16px;border-radius:var(--r);z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13px;display:flex;gap:8px;align-items:center}
:root[data-theme="dark"] .toast{background:#ECECEF;color:#1C1D21}

/* design system page */
.ds-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.sw{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:12px}
.sw i{display:block;height:56px}
.sw div{padding:8px 10px}
.sw b{display:block;font-size:13px;font-weight:600}
.pairs{width:100%;border-collapse:collapse;min-width:640px}
.pairs td,.pairs th{padding:12px 14px}
.ds-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rule{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.rule:first-child{border-top:0}

.page{margin-inline:auto}
@media (max-width:1100px){.grid-dash{grid-template-columns:minmax(0,1fr)}.ritual{grid-template-columns:minmax(0,1fr)}}

function route(){const h=(location.hash||'').slice(1);return h||'cong-viec'}

function renderNav(){
  const r=route();const base=r.startsWith('ho-so')?'khach-hang':r;
  const link=n=>`<a href="#${n.h}" class="${base===n.h?'on':''} ${n.soon?'soon':''}" ${base===n.h?'aria-current="page"':''} title="${PAIRS[n.p].ca}${n.soon?' · Sắp có':''}"><span class="dot" style="background:var(--${n.p})"></span><span>${n.t}</span></a>`;

}

   <circle cx="60" cy="60" r="56" fill="var(--surface)" stroke="var(--line2)"/>
   <circle cx="60" cy="60" r="44" fill="none" stroke="var(--line)" stroke-dasharray="2 4"/>

}

    <span style="font-size:16px;line-height:20px;font-weight:600">16/20 Tiêu đề thẻ</span><span>14/18 Nội dung</span><span style="font-size:12px;color:var(--fg3)">12/16 Chú thích</span></div></section>
  <section class="card"><header><h2>Component</h2></header><div class="body col">
    <div class="ds-row"><button class="btn pri">Chính</button><button class="btn">Xám</button><button class="btn sec">Phụ</button><button class="btn sm sec">Nhỏ</button></div>
    <div class="ds-row"><span class="chip new">Khách mới</span><span class="chip ok">Đang hoạt động</span><span class="chip warn">Có dấu hiệu rời</span><span class="chip">Ngưng hoạt động</span><span class="chip">Biến cố</span><span class="chip">Theo nhịp</span></div>
    <div class="ds-row">${ORDER.map(k=>`<button class="lchip ${k==='work'?'on':''}" style="${cv(k)}">${ic(PAIRS[k].ic,'sm')}${PAIRS[k].ca}</button>`).join('')}</div>
    <div class="card" style="box-shadow:none">${taskRow(tasks[0])}</div></div></section>
  <section class="card"><header><h2>Lan can trong thiết kế</h2></header><div class="body">
    ${['Không có bảng xếp hạng, không có ô doanh số trên màn việc hằng ngày.','La bàn chỉ hướng kèm lý do, không hiển thị phần trăm để so giữa các kim.','Mỗi lúc một kim sáng, ba kim còn lại lùi xuống.','Lời khách giữ nguyên văn, đặt song song với bản mình ghi nhận.','Câu hỏi đồng hành và Nhìn lại tuần chỉ mình CA xem.','Cảnh báo dùng màu tiết chế, không đỏ rực, không đếm hàng trăm việc.'].map(r=>`<div class="rule">${ic('check','sm')}<span>${r}</span></div>`).join('')}</div></section>
  </div>`;
}

/* ---------- Log drawer ---------- */
function openLog(cid,tid){
  const layer=document.getElementById('layer');
  const opts=clients.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${c.name} · ${c.id}</option>`).join('');
  const evs=cid?openTasks().filter(t=>t.cid===cid):[];
  layer.innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="lg-h">
   <header><h2 id="lg-h">Ghi nhận tương tác</h2><button class="iconbtn" style="margin-left:auto" data-close aria-label="Đóng">${ic('x','sm')}</button></header>
   <form id="logf">
    <div class="fld"><label for="lg-c">Khách hàng</label><select id="lg-c" required><option value="">Chọn khách</option>${opts}</select></div>
    <div class="fld"><span class="lb">Hình thức</span><div class="seg">${[['call','Gọi'],['meet','Gặp'],['chat','Zalo'],['mail','Email']].map(([k,t],i)=>`<label><input type="radio" name="ch" value="${k}" ${i===0?'checked':''}>${t}</label>`).join('')}</div></div>
    <div class="fld"><label for="lg-s">Khách nói gì</label><textarea id="lg-s" placeholder="Ghi đúng lời khách, đừng tóm tắt"></textarea><span class="hint">Lời khách được giữ nguyên văn trong hồ sơ.</span></div>
    <div class="fld"><label for="lg-n">Mình ghi nhận</label><textarea id="lg-n" placeholder="Điều mình nhận ra, việc đã hẹn"></textarea></div>
    <div class="fld"><label for="lg-d">Hẹn lần tiếp theo</label><input id="lg-d" type="date" value="2026-12-03"></div>
    <div class="fld" id="lg-evw"><span class="lb">Đóng sự kiện</span>${evs.length?evs.map(t=>`<label class="chk"><input type="checkbox" name="ev" value="${t.id}" ${String(t.id)===String(tid)?'checked':''}><span><b>${t.t}</b><br><span style="color:var(--fg3)">${PAIRS[t.pair].cl} · ${t.lane==='nac'?'Biến cố':'Theo nhịp'}</span></span></label>`).join(''):'<span class="hint">Khách này không có sự kiện nào đang mở.</span>'}</div>
   </form>
   <footer><button class="btn" data-close>Huỷ</button><button class="btn pri" type="submit" form="logf">Lưu vào sổ chăm</button></footer></aside>`;
  layer.querySelector('#lg-c').addEventListener('change',e=>{openLog(e.target.value,null)});
  layer.querySelector('#logf').addEventListener('submit',e=>{
    e.preventDefault();const f=e.target;const id=f.querySelector('#lg-c').value;if(!id)return;
    const ch=f.querySelector('input[name=ch]:checked').value;const lbl={call:'Cuộc gọi',meet:'Gặp',chat:'Zalo',mail:'Email'}[ch];
    const said=f.querySelector('#lg-s').value.trim(),note=f.querySelector('#lg-n').value.trim(),d=f.querySelector('#lg-d').value;
    const closed=[...f.querySelectorAll('input[name=ev]:checked')].map(x=>+x.value);closed.forEach(x=>S.done.add(x));
    const nd=d?d.split('-').reverse().join('/'):'';
    (S.logs[id]=S.logs[id]||[]).unshift({ch,d:'19/11/2026',t:lbl,by:'Bạn',said:said?`“${said}”`:'',note:(note||'Đã ghi nhận.')+(nd?` Hẹn lần tới ${nd}.`:''),next:nd});
    C(id).last=0;closeLog();render();toast(`Đã lưu vào sổ chăm của ${C(id).name}${closed.length?` · đóng ${closed.length} sự kiện`:''}`);
  });
  setTimeout(()=>layer.querySelector(cid?'#lg-s':'#lg-c').focus(),0);
}
function closeLog(){document.getElementById('layer').innerHTML=''}
let tt;function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=ic('check','sm')+m;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),2800)}

/* ---------- render & events ---------- */
function render(){
  renderNav();renderLens();const r=route();const p=document.getElementById('page');
  if(r==='cong-viec')p.innerHTML=dash();
  else if(r==='khach-hang')p.innerHTML=clientList();
  else if(r.startsWith('ho-so-'))p.innerHTML=profile(r.slice(6));
  else if(r==='he-thong')p.innerHTML=ds();
  else if(['ho-tro','ket-qua','phat-trien'].includes(r))p.innerHTML=soon(r);
  else p.innerHTML=dash();
}
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-lens]');if(l){S.lens=l.dataset.lens;try{localStorage.setItem('dsb-lens',S.lens)}catch(x){}render();return}
  const lg=e.target.closest('[data-log]');if(lg){openLog(lg.dataset.log,lg.dataset.task);return}
  if(e.target.closest('[data-close]')){closeLog();return}
  const st=e.target.closest('[data-stage]');if(st){S.stage=st.dataset.stage;render();return}
  const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();return}
  const chn=e.target.closest('[data-chan]');if(chn){S.chan=chn.dataset.chan;render();return}
  const tr=e.target.closest('tr[data-go]');if(tr){location.hash='ho-so-'+tr.dataset.go;return}
  if(e.target.closest('#nextQ')){S.qi++;render();return}
  if(e.target.closest('#saveQ')){const v=document.getElementById('jr').value.trim();toast(v?'Đã lưu vào sổ riêng của bạn':'Viết vài chữ trước khi lưu nhé');return}
  if(e.target.closest('#logBtn')){const r=route();openLog(r.startsWith('ho-so-')?r.slice(6):'',null);return}
  if(e.target.closest('#aiBtn')){toast('Trợ lý AI sẽ tra kho KMS · bản prototype chưa nối');return}
  if(e.target.closest('#themeBtn')){const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dark?'light':'dark';return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLog();const tr=e.target.closest&&e.target.closest('tr[data-go]');if(tr&&e.key==='Enter')location.hash='ho-so-'+tr.dataset.go});
document.getElementById('q').addEventListener('input',()=>{if(route()!=='khach-hang')location.hash='khach-hang';else render()});
window.addEventListener('hashchange',()=>{if(route().startsWith('ho-so-')){S.tab='go';S.chan='all'}render();window.scrollTo(0,0)});
render();
</script>
