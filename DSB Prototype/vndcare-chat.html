<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>VNDCARE Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fa;--panel:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb;--primary-soft:#eaf1ff;--ok:#067647;--ok-bg:#e7f6ee;--warn:#92400e;--warn-bg:#fef3c7;--bad:#b42318;--bad-bg:#fee4e2;--ag:#6d28d9;--ag-bg:#f3e8ff;--kdgo:#0891b2;--kinv:#2563eb;--kcare:#d97706;--kval:#7c3aed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--panel:#171a21;--ink:#f3f4f6;--muted:#9ca3af;--line:#2a2f3a;--primary:#60a5fa;--primary-soft:#172554;--ok:#6ee7b7;--ok-bg:#0b2e22;--warn:#fcd34d;--warn-bg:#3a2a07;--bad:#fca5a5;--bad-bg:#3b1414;--ag:#c4b5fd;--ag-bg:#2a1a4d}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh;position:relative;overflow:hidden}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 8px 12px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center}.logo svg{width:16px;height:16px}
.nav-g{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.side .it{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:7px 10px;border-radius:8px;text-align:left;min-height:34px}
.side .it:hover{background:var(--bg)}
.side .it[aria-current=page]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.Dgo{background:var(--kdgo)}.dot.Dinvest{background:var(--kinv)}.dot.Dcare{background:var(--kcare)}.dot.Dvalues{background:var(--kval)}
.pill{margin-left:auto;background:#dc2626;color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;gap:16px;color:var(--muted);font-size:12px}
.all{margin-top:6px}.all summary{cursor:pointer;color:var(--muted);font-size:12px;padding:6px 10px}
.lnk{border:0;background:transparent;color:var(--primary);padding:0;text-align:left;font-size:13px}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:16px;margin:0;font-weight:600}.top .sub{color:var(--muted);font-size:12px}.sp{flex:1}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.menu-btn{display:none}
.stream{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.m{display:flex;gap:10px;max-width:760px}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;background:var(--ag-bg);color:var(--ag)}
.m.me .av{background:var(--primary-soft);color:var(--primary)}.m.kh .av{background:var(--warn-bg);color:var(--warn)}
.bub{min-width:0}
.who{font-size:12px;color:var(--muted);margin-bottom:2px}.who b{color:var(--ink)}
.txt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;white-space:pre-wrap}
.m.me .txt{background:var(--primary);color:#fff;border-color:var(--primary)}
.sys{align-self:center;color:var(--muted);font-size:12px;text-align:center;max-width:620px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;min-width:min(520px,100%)}
.card h3{margin:0 0 6px;font-size:14px}
.card.ag{border-color:var(--ag)}.card.warn{background:var(--warn-bg);border-color:#f59e0b}.card.bad{background:var(--bad-bg)}
.card p{margin:4px 0;white-space:pre-wrap}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;background:var(--primary-soft);color:var(--primary)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.src{color:var(--muted);font-size:12px}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}.item .t b{display:block}
.grp{font-size:12px;font-weight:600;margin:10px 0 2px;display:flex;align-items:center;gap:6px}
textarea.draft{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.chk{display:flex;gap:6px;font-size:12px;color:var(--muted)}.chk .ok{color:var(--ok)}.chk .bad{color:var(--bad)}
.tgl{display:flex;align-items:center;gap:8px;padding:6px 0}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}
.how{font-size:12px;color:var(--muted);margin-top:4px}
.compose-w{border-top:1px solid var(--line);background:var(--panel);padding:10px 20px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.chips button:hover{border-color:var(--primary);background:var(--primary-soft)}
.compose{display:flex;gap:8px}.compose input{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.prof{display:none;position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:6;overflow:auto;padding:16px}
body.prof-open .prof{display:block}
.prof h3{margin:14px 0 6px;font-size:13px}
.prof .f{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.prof input{width:60%;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg)}
.quote{border-left:3px solid var(--primary);padding:2px 10px;margin:4px 0;color:var(--ink)}.quote.e{border-color:var(--line);color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:560px;width:92%;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dt{font-weight:600;margin-top:8px}dd{margin:0;color:var(--muted)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;z-index:20}
.toast[hidden]{display:none}
.pal-btn{margin:0 8px 6px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);text-align:left;padding:0 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
kbd{font:11px Inter,sans-serif;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel)}
#pal{padding:10px;width:min(520px,92%);top:15vh;margin-top:0}#palInp{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
#palL button{display:flex;gap:8px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left}#palL button:hover,#palL button.on{background:var(--primary-soft)}
.nextbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:var(--primary-soft);border-bottom:1px solid var(--line)}.nextbar[hidden]{display:none}.nextbar b{color:var(--primary)}
.q{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}.q .big{font-size:16px;font-weight:600}.q .qq{border-left:3px solid var(--primary);padding:2px 10px;margin:8px 0;background:var(--bg)}
.rest{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.chips button.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.hist{align-self:center}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:10;transform:translateX(-100%);transition:transform .2s}body.side-open .side{transform:none}.menu-btn{display:inline-flex;align-items:center}.stream,.compose-w{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.kr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}.kr.on{border-color:var(--primary);background:var(--primary-soft)}.kr.off{opacity:.8}.kr .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.kr .q{font-size:12px;color:var(--muted)}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.nums div{border:1px dashed var(--line);border-radius:8px;padding:6px;font-size:12px}.nums b{display:block;font-size:12px}
.is-dash .compose-w{display:none}
.dash{max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kp.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.kp h2{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kp h2 .src{font-weight:400}
.kp select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--bg);width:100%}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}.stat .n{font-size:22px;font-weight:700;display:block;line-height:1.2}
.kp .sub3{font-size:12px;font-weight:600;margin-top:4px}
.kp .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:6px}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
@media (max-width:820px){.dgrid{grid-template-columns:1fr}.stat .n{font-size:18px}}
</style>
</head>
<body>


<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></div><span>VNDCARE</span></div>
    <button class="pal-btn" id="palBtn" type="button">Tìm khách hoặc lệnh <kbd>Ctrl K</kbd></button>
    <nav id="nav" aria-label="Phòng chat"></nav>
    <div class="side-foot"><button class="lnk" id="glossBtn" type="button">Từ điển</button><button class="lnk" data-q="cài đặt" type="button">Cài đặt</button></div>
  </aside>
  <section class="main">
    <header class="top"><button class="btn menu-btn" id="menuBtn" type="button">Menu</button><h1 id="title"></h1><span class="sub" id="sub"></span><span class="sp"></span><button class="btn" id="profBtn" type="button" hidden>Hồ sơ khách</button></header>
    <div class="nextbar" id="nextbar" hidden></div>
    <div class="stream" id="stream" aria-live="polite"></div>
    <div class="compose-w"><div class="chips" id="chips"></div>
      <form class="compose" id="form"><input id="inp" placeholder="Hỏi trợ lý hoặc ra việc, ví dụ: khách nào cần chăm hôm nay?" aria-label="Tin nhắn" autocomplete="off"><button class="btn primary" type="submit">Gửi</button></form></div>
  </section>
  <aside class="prof" id="prof" aria-label="Hồ sơ khách"></aside>
</div>
<dialog id="gloss"><b>Từ điển</b><dl id="glossL"></dl><button class="btn" id="glossX" type="button">Đóng</button></dialog>
<dialog id="pal"><input id="palInp" placeholder="Gõ mã khách (0412), hoặc: việc hôm nay, ticket, cài đặt..." aria-label="Tìm" autocomplete="off"><div id="palL"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var tt;function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2800)}
  window.addEventListener('error',function(e){document.documentElement.setAttribute('data-err',e.message)});

  /* ===== Dữ liệu mẫu ===== */
  var KIMS=['Dgo','Dinvest','Dcare','Dvalues'];
  var KGLOSS={Dgo:'mời khách nói lại đích',Dinvest:'cùng đặt nhịp góp, kế hoạch',Dcare:'đứng cạnh đúng lúc',Dvalues:'cùng đọc lại kết quả'};
  var STAGE={on:'Mới đón vào · Be-on',in:'Đang đồng hành · Be-in',out:'Rời hoặc ngủ · Be-out'};
  var NEN={V:'Trà Việt · Điều coi trọng',N:'La Bàn · Nền và nhu cầu',D:'Soi Sáng · Kỷ luật đầu tư',G:'Tích Năng Lực · Mục tiêu',O:'Sống Đầu Tư · Kết quả'};
  var VND=[['V','Giá trị và tầm nhìn'],['N','Nhu cầu và nuôi dưỡng'],['D','Ước mơ và kỷ luật'],['C','Đồng hành'],['A','Nói vì bạn'],['R','Trách nhiệm'],['E','Trao quyền'],['S','Phụng sự']];
  var khach=[
    {id:'K-0412',name:'Nguyễn Minh Anh',goi:'DCA',st:'in',kim:'Dcare',ev:'Thị trường giảm 3 ngày liên tiếp',ch:'Zalo',nhip:'Mỗi 2 tuần',note:'',
      ne:{V:'«Mình muốn có một khoản để con đi học nước ngoài năm 2035.»',N:'«Mình còn khoản vay mua nhà nên chỉ để dành được từ lương.»',D:'«Mình tự hứa không bán chỉ vì thị trường giảm vài tháng.»',G:'«Mỗi tháng góp một khoản cố định, tăng dần theo lương.»',O:''},
      tl:[['12/11','Buổi gặp 40 phút. Khách kể lại đích bằng lời của mình.'],['05/11','Máy chuẩn bị tờ đọc lại cho buổi gặp.'],['28/10','Khách nói: «Mình tự hứa không bán chỉ vì thị trường giảm vài tháng.»']]},
    {id:'K-0388',name:'Trần Quốc Bảo',goi:'DCA',st:'in',kim:'Dvalues',ev:'Cuối kỳ: tài khoản chạy, người đứng yên 3 kỳ',ch:'Hotline',nhip:'Mỗi tháng',note:'',ne:{V:'«Mình muốn nghỉ hưu sớm, không phụ thuộc con cháu.»',N:'',D:'',G:'',O:''},tl:[['02/09','Buổi gặp ngắn qua điện thoại, khách chưa muốn kể thêm.']]},
    {id:'K-0455',name:'Lê Thu Hà',goi:'DCA',st:'on',kim:'Dgo',ev:'Hồ sơ lớp nền còn thiếu',ch:'Email',nhip:'Mỗi tuần',note:'',ne:{V:'«Mình muốn có nhà riêng trước tuổi 40.»',N:'',D:'',G:'',O:''},tl:[['15/11','Khách nói: «Mình muốn có nhà riêng trước tuổi 40.»']]},
    {id:'K-0461',name:'Phạm Gia Huy',goi:'DCA',st:'on',kim:'Dinvest',ev:'Hồ sơ đủ, chờ nháp kế hoạch',ch:'Zalo',nhip:'Mỗi 2 tuần',note:'',ne:{V:'«Mình muốn có nguồn thu thứ hai ngoài lương.»',N:'«Mình đã có quỹ dự phòng sáu tháng.»',D:'',G:'',O:''},tl:[['17/11','Đọc KYC và NRX cùng khách, hồ sơ lớp nền đã đủ.']]},
    {id:'K-0190',name:'Bùi Lan Chi',goi:'DCA',st:'out',kim:'Dcare',ev:'Đã ngủ: chờ người khác CA hỏi vì sao rời',ch:'Email',nhip:'Chờ',note:'',ne:{V:'«Mình muốn đi du học.»',N:'',D:'',G:'',O:''},tl:[]},
    {id:'K-0301',name:'Vũ Hải Yến',goi:'DA',st:'in',kim:'Dinvest',ev:'Khách tự chủ hỏi trên app',ch:'App Dcare',nhip:'Đội chăm số',note:'',ne:{V:'',N:'',D:'',G:'',O:''},tl:[]},
    {id:'K-0277',name:'Đỗ Thanh Tùng',goi:'DMA',st:'in',kim:'Dvalues',ev:'Kỳ đọc lại theo đối tác',ch:'Qua đối tác',nhip:'Partner giữ nhịp',note:'',ne:{V:'',N:'',D:'',G:'',O:''},tl:[]}
  ];
  function K(id){return khach.filter(function(k){return k.id===id})[0]}
  var TRACK={'K-0412':'VNDSIP','K-0388':'VNDWealth','K-0461':'VNDSIP','K-0301':'VNDTrade','K-0277':'VNDWealth'};
  var WHO={DA:'Hệ thống, không có người tên riêng',DCA:'Một CA đứng tên (bạn)',DMA:'Đối tác giữ, nhà vẫn chịu chuẩn'};
  function dcomp(k){
    var q={Dgo:'Khách đang ở nếp nào',Dinvest:'Định đi thế nào',Dcare:'Ai đi cùng từ đây',Dvalues:'Đang ở đâu so với đích'};
    var have=Object.keys(NEN).filter(function(x){return k.ne[x]});
    var body={
      Dgo:'Đã có lời khách ở: '+(have.length?have.join(' · '):'chưa có nếp nào')+'. Chỉ ghi lời khách, không chấm điểm.',
      Dinvest:'Track: <b>'+(TRACK[k.id]||'chưa chọn')+'</b>. Kế hoạch do khách tự đặt, máy chỉ nháp theo tháp HWG.',
      Dcare:'Gói <b>'+k.goi+'</b>: '+WHO[k.goi]+'. Nhịp: '+k.nhip+'. Kênh: '+k.ch+'.',
      Dvalues:'Ba khoản khác loại, không gộp thành một số.<div class="nums"><div><b>CMI</b>khách chín tới đâu<br><span class="src">ô chờ số</span></div><div><b>NAV</b>đang có<br><span class="src">ô chờ số</span></div><div><b>P&amp;L</b>đã đi qua<br><span class="src">ô chờ số</span></div></div>'};
    return KIMS.map(function(kim){var on=k.kim===kim;return '<div class="kr '+(on?'on':'off')+'"><div class="h"><span class="dot '+kim+'"></span><b>'+kim+'</b><span class="q">'+q[kim]+'</span>'+(on?'<span class="badge">Đang sáng</span>':'')+'</div><div style="margin-top:4px">'+body[kim]+'</div></div>'}).join('');
  }

  function R(c){return {s:'ag',card:c}}
  function reply(q){
    var t=q.toLowerCase(),id=state.room,out=[];
    if(/xếp hạng|doanh số|chấm điểm|top |so sánh ca|ai giỏi/.test(t))return [R({kind:'refuse',what:'xếp hạng hay chấm điểm',why:'Khách đọc so với chính họ kỳ trước, CA đọc so với chính mình. Doanh số không phải thước của nhà.',alt:'đưa danh sách khách theo kim sáng, chia theo người nhận, không thứ tự.',chip:'Khách của tôi'})];
    if(/mã cổ phiếu|nên mua|nên bán mã|dự phóng|chào bán|lãi suất dự kiến/.test(t))return [R({kind:'refuse',what:'gợi ý mã hoặc dự phóng lãi',why:'Máy không đưa mã, không dự phóng lãi, không chào bán. Quyết định là của khách.',alt:'chuẩn bị câu hỏi mở để khách tự nói lại nguyên tắc của họ.',chip:id==='home'?'':'Chuẩn bị gặp khách'})];
    if(/nhắn khách|gửi khách|liên hệ khách|nói thay|điền hộ|đặt hộ/.test(t))return [R({kind:'refuse',what:'liên lạc hay làm thay khách',why:'Máy chỉ chuẩn bị. Người nhắn, gọi và gặp khách là CA.',alt:'soạn bản nháp để bạn đọc, sửa rồi tự gửi.'})];
    if(id==='home'){
      if(/my dcare|dashboard|bốn la bàn|la bàn của tôi|tự soi|icompass/.test(t)){open('dash');return []}
      if(/từ điển/.test(t)){$('#gloss').showModal();return [{s:'sys',x:'Đã mở Từ điển.'}]}
      if(/cài đặt|lan can|trợ lý/.test(t))return [R({kind:'settings'})];
      if(/tự soi|icompass/.test(t))return [R({kind:'self'})];
      if(/thế nào|lớn lên|chỉ số|thước/.test(t))return [R({kind:'met'})];
      if(/việc|hôm nay|cần làm|cần chăm|chăm/.test(t))return [R({kind:'queue'})];
      if(/ticket|yêu cầu/.test(t))return [R({kind:'ticket'})];
      if(/kim|khách/.test(t))return [R({kind:'kim'})];
      return [{s:'ag',x:'Mình làm được: việc hôm nay, khách của tôi, ticket chờ bạn, bạn đang đi thế nào, tự soi, cài đặt. Muốn làm việc với một khách thì mở phòng của khách ở cột bên trái.'}];
    }
    var k=K(id);
    if(/la bàn|dcompass|bốn kim|kim sáng/.test(t))return [R({kind:'dcomp',kid:id})];
    if(/xác minh/.test(t))return [R({kind:'info',cls:'warn',t:'Xác minh danh tính trước khi đổi thông tin',b:'1) Gọi lại đúng số khách đã đăng ký, không gọi số khách vừa đưa.\n2) Đối chiếu hai thông tin chỉ khách mới biết.\n3) Ghi dấu vết chăm, rồi xử lý theo quy trình đổi tài khoản.\nKhông đổi số tài khoản qua tin nhắn.'})];
    if(/chuẩn bị|chuanbi/.test(t)){var p=PREP[id]||{t:'Tờ đọc lại · '+id,checks:['Lời khách nguyên văn','Không xếp hạng khách'],b:'Đích khách tự đặt: xem lời khách ở tab Hồ sơ.\nKim sáng: '+k.kim+' ('+KGLOSS[k.kim]+').\nBiến cố: '+k.ev+'.\nGợi ý mở đầu: mời khách nói lại bằng chữ của họ, không đưa lời khuyên.'};return [R({kind:'prep',t:p.t,checks:p.checks,b:p.b})]}
    if(/kết thúc|ghi lại|ketthuc|nhìn lại/.test(t))return [R({kind:'letters',set:{},saved:false})];
    if(/bàn giao|bangiao/.test(t))return [R({kind:'hand',kid:id,set:[],sent:false})];
    if(/lời khách|tóm tắt|tomtat|nói gì/.test(t))return [R({kind:'quote',kid:id})];
    if(/hồ sơ/.test(t)){state.prof=true;return [{s:'sys',x:'Đã mở hồ sơ.'}]}
    return [{s:'ag',x:'Trong phòng này mình giúp: chuẩn bị gặp khách, xem lời khách nói, ghi lại sau buổi gặp, bàn giao. Bấm nút bên dưới.'}];
  }

      +'<div class="src">Hai thẻ tách nhau. Không có điểm tổng, không xếp hạng giữa các CA.</div>';
    return '<div class="dash"><div class="strip"><div class="row"><b>Dcare hôm nay</b><span class="src">'+pn+' việc chờ · '+drafts()+' bản máy chờ đọc'+(state.prep['K-0412']?'':' · hẹn 15:00')+'</span><span class="sp"></span><button class="btn primary sm" type="button" data-do="next">Mở hàng đợi</button></div>'
      +'<div class="src" style="margin-top:4px">'+(sang?'Kim sáng hôm nay: <b>'+sang+'</b> ('+P[sang]+'). Mỗi lúc một kim sáng.':'Hôm nay bạn đã soi đủ bốn kim.')+'</div>'
      +'<div class="row" style="margin-top:6px"><span class="badge gray">Không điểm</span><span class="badge gray">Không xếp hạng</span><span class="badge gray">Doanh số không phải thước chính</span></div></div>'
      +'<div class="dgrid">'+panel('iGo',iGo)+panel('iWork',iWork)+panel('iLink',iLink)+panel('iValues',iValues)+'</div></div>';
  }
  function renderDash(){
    var st=$('#stream'),keep=st.scrollTop;
    $('#title').textContent='My Dcare';
    $('#sub').textContent='Bốn kim của chính bạn (iCompass)';
    $('#profBtn').hidden=true;$('#nextbar').hidden=true;document.body.classList.remove('prof-open');
    renderNav();$('#prof').innerHTML='';$('#chips').innerHTML='';
    st.innerHTML=dash();st.scrollTop=keep;
  }
  function render(){
    var id=state.room;document.body.classList.toggle('is-dash',id==='dash');if(id==='dash'){renderDash();return}
    var home=id==='home',k=home?null:K(id),arr=msgs(id);
    $('#title').textContent=home?'Trợ lý của tôi':'# '+k.id+' · '+k.name;
    $('#sub').textContent=home?(qitems().length+' việc · '+drafts()+' bản máy chờ đọc'+(state.prep['K-0412']?'':' · hẹn 15:00')):'Kim sáng: '+k.kim+' · '+STAGE[k.st]+' · '+k.goi;
    $('#profBtn').hidden=home;document.body.classList.toggle('prof-open',!home&&state.prof);
    var nb=$('#nextbar');
    if(home)nb.hidden=true;else{nb.hidden=false;var th=threads.filter(function(t){return t.kid===id&&t.st==='needs'})[0],txt,btn='';
      if(k.goi!=='DCA')txt='Khách do đội khác giữ. Phòng chỉ để đọc.';
      else if(th)txt=th.hot?'<b>Việc kế tiếp:</b> xác minh danh tính, rồi xử lý tin '+th.ch+' theo quy trình.':'<b>Việc kế tiếp:</b> đọc bản máy, sửa và gửi trả lời tin '+th.ch+'.';
      else if(id==='K-0412'&&!state.prep[id]){txt='<b>Việc kế tiếp:</b> chuẩn bị buổi hẹn 15:00.';btn='<button class="btn sm" data-q="Chuẩn bị gặp khách">Chuẩn bị</button>'}
      else{txt='<b>Không còn việc chờ.</b> Sau buổi gặp, ghi lại tám chữ.';btn='<button class="btn sm" data-q="Ghi lại sau buổi gặp">Ghi lại</button>'}
      nb.innerHTML='<span class="dot '+k.kim+'" title="Kim sáng"></span><span>'+txt+'</span><span class="sp"></span>'+btn}
    lastQ=-1;arr.forEach(function(m,n){if(m.card&&m.card.kind==='queue')lastQ=n});
    renderNav();chips();profile();
    var lim=state.hist[id]?0:Math.max(0,arr.length-6),h='';
    if(lim>0)h+='<div class="sys hist"><button class="lnk" data-do="hist" type="button">Xem lịch sử cũ ('+lim+' mục)</button></div>';
    for(var n=lim;n<arr.length;n++)h+=msgHtml(arr[n],n);
    var st=$('#stream');st.innerHTML=h;st.scrollTop=st.scrollHeight;
  }
  function open(id,run){state.room=id;state.prof=false;document.body.classList.remove('side-open');render();if(run)ask(run)}

  /* ===== Sự kiện ===== */
  document.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;var d=t.dataset;
    if(d.room){open(d.room,d.run);return}
    if(d.q){if(state.room!=='home'&&/^(cài đặt)$/.test(d.q))open('home');ask(d.q);return}
    if(t.id==='menuBtn'){document.body.classList.toggle('side-open');return}
    if(t.id==='profBtn'){state.prof=!state.prof;render();return}
    if(t.id==='glossBtn'){$('#gloss').showModal();return}
    if(t.id==='glossX'){$('#gloss').close();return}
    if(t.id==='palBtn'){palOpen();return}
    if(d.pi!==undefined){palPick(+d.pi);return}
    if(d.do==='dtoast'){toast(d.t);return}
    if(d.do==='mread'){state.morning=true;render();return}
    if(d.do==='hist'){state.hist[state.room]=true;render();return}
    if(d.do==='next'){open('home');return}
    if(d.do==='qsnz'){state.snz[d.k]=(state.snz[d.k]||0)+1;render();return}
    if(d.do==='qopen'){var it=qitems().filter(function(x){return x.key===d.k})[0];open(it.kid,it.run);return}
    var i=+d.i,m=state.room==='dash'?null:msgs(state.room)[i],c=m&&m.card;
    if(d.do==='profx'){state.prof=false;render();return}
    if(d.do==='send'){var th=threads.filter(function(x){return x.id===c.tid})[0];th.st='done';c.state='sent';m.s='ag';var ta=document.querySelector('textarea[data-i="'+i+'"]');if(ta)c.text=ta.value;K(th.kid).tl.unshift([ 'Vừa xong','CA trả lời '+th.ch+' (bản máy, CA đã đọc và chỉnh).']);msgs(state.room).push({s:'sys',x:'CA đã gửi cho khách qua '+th.ch+'. Đã ghi dấu vết chăm.'});toast('CA đã gửi. Đã ghi dấu vết chăm.');render();return}
    if(d.do==='handled'){var th3=threads.filter(function(x){return x.id===c.tid})[0];th3.st='done';msgs(state.room).push({s:'sys',x:'Hà Trần đã xử lý tin '+th3.ch+' theo quy trình. Đã ghi dấu vết chăm.'});render();return}
    if(d.do==='drop'){c.state='dropped';render();return}
    if(d.do==='use'){c.state='used';state.prep[state.room]=true;msgs(state.room).push({s:'sys',x:'Hà Trần đã đọc và dùng: '+c.t});render();return}
    if(d.do==='letter'){c.set[d.l]=!c.set[d.l];render();return}
    if(d.do==='lsave'){c.saved=true;msgs(state.room).push({s:'sys',x:'Đã ghi vào sổ chăm. Chữ đã chạm: '+Object.keys(c.set).filter(function(x){return c.set[x]}).join(' · ')});render();return}
    if(d.do==='hsend'){c.sent=true;msgs(state.room).push({s:'sys',x:'Bàn giao '+c.kid+' đã gửi, chờ người duyệt. Người mới sẽ thấy đủ sáu việc.'});render();return}
    if(d.do==='how'){state.how[d.id]=!state.how[d.id];render();return}
  });
  document.addEventListener('change',function(e){
    var t=e.target,d=t.dataset;
    if(d.do==='self'){state.self[d.k]=t.checked;toast(t.checked?'Đã soi '+d.k:'Bỏ soi '+d.k);if(state.room==='dash')render();return}
    if(d.do==='ipax'){state.ipax[d.k]=t.checked;render();return}
    if(d.do==='vuong'){state.vuong=+t.value;render();return}
    if(d.do==='hand'){var c=msgs(state.room)[+d.i].card;c.set[+d.n]=t.checked;render();return}
    if(d.do==='note'){var k=K(state.room);k.note=t.value;msgs(state.room).push({s:'sys',x:'Hà Trần sửa ghi chú nội bộ: '+t.value});render();return}
  });
  document.addEventListener('input',function(e){var t=e.target;if(t.classList.contains('draft')){msgs(state.room)[+t.dataset.i].card.text=t.value}});
  $('#form').addEventListener('submit',function(e){e.preventDefault();var v=$('#inp').value;$('#inp').value='';ask(v)});
  $('#glossL').innerHTML=GL.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>'}).join('');
  /* Tìm nhanh (Ctrl K) */
  var palIt=[];
  function nz(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d')}
  function palBuild(q){var all=khach.map(function(k){return {l:k.id+' · '+k.name,s:'Mở phòng · kim sáng '+k.kim,f:function(){open(k.id)}}}).concat([{l:'My Dcare',s:'Dashboard bốn kim của tôi (iCompass)',f:function(){open('dash')}}]).concat([['Việc hôm nay','việc hôm nay'],['Khách của tôi','khách của tôi'],['Ticket chờ tôi','ticket chờ tôi'],['Tôi đang đi thế nào','tôi đang đi thế nào'],['Cài đặt và lan can','cài đặt']].map(function(c){return {l:c[0],s:'Hỏi trợ lý',f:function(){open('home');ask(c[1])}}}));
    var n=nz(q||'');palIt=all.filter(function(x){return !n||nz(x.l).indexOf(n)>=0}).slice(0,8);
    $('#palL').innerHTML=palIt.map(function(x,i){return '<button type="button" data-pi="'+i+'" class="'+(i===0?'on':'')+'"><b>'+esc(x.l)+'</b><span class="src">'+esc(x.s)+'</span></button>'}).join('')||'<div class="src" style="padding:8px">Không thấy. Thử gõ mã khách, ví dụ 0412.</div>'}
  function palOpen(){$('#pal').showModal();$('#palInp').value='';palBuild('');$('#palInp').focus()}
  function palPick(i){var x=palIt[i];if(!x)return;$('#pal').close();x.f()}
  $('#palInp').addEventListener('input',function(e){palBuild(e.target.value)});
  $('#palInp').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();palPick(0)}});
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen()}});
  render();
})();
</script>

</body>
