argin: 0 auto; padding: 88px 24px 104px; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<h1 style=\"margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 500; font-size: 56px; line-height: 1.12; color: #1F3A2E\">Nền của bạn đỡ được tới đâu?<\/h1>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A554E\">Một ngôi nhà vững bắt đầu từ nền. Ba câu hỏi về ba lớp nền — không cần số liệu, chỉ cần bạn thật lòng với mình.<\/p>\n<\/div>\n\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<sc-for list=\"{{layers}}\" as=\"layer\" hint-placeholder-count=\"3\">\n<fieldset style=\"border: 1px solid #E3DCCB; background: #FFFDF8; border-radius: 20px; margin: 0; padding: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items: center\">\n<legend style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">{{layer.name}}<\/legend>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: #8A6A2E\">{{layer.name}}<\/span>\n<span style=\"font-size: 19px; line-height: 1.5; color: #1C2420\">{{layer.q}}<\/span>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{layer.opts}}\" as=\"o\" hint-placeholder-count=\"3\">\n<button type=\"button\" onClick=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\" style=\"{{o.css}}\">{{o.label}}<\/button>\n<\/sc-for>\n<\/div>\n<\/fieldset>\n<\/sc-for>\n<\/div>\n\n<section style=\"background: #1F3A2E; color: #F6F2E9; border-radius: 24px; padding: 48px; display: flex; flex-direction: column; gap: 28px\">\n<p style=\"margin: 0; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: #D9B26A\">Bản soi nền của bạn<\/p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16p gia, serif; font-size: 28px; font-weight: 600; letter-spacing: 1px; color: #1F3A2E; text-decoration: none\">VNDIRECT<\/a>\n<div style=\"display: flex; align-items: center; gap: 16px; font-size: 14px; color: #4A554E\">\n<span>Đường đi<\/span>\n<a href=\"MoTaiKhoan.dc.html\" style=\"padding: 10px 0\">Để sau<\/a>\n<\/div>\n<\/div>\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 0 24px\">\n<div style=\"height: 4px; background: #E3DCCB; border-radius: 2px\"><div style=\"width: 60%; height: 4px; background: #8A6A2E; border-radius: 2px\"><\/div><\/div>\n<\/div>\n<\/header>\n\n<main style=\"max-width: 1180px; margin: 0 auto; padding: 88px 24px 104px; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<h1 style=\"margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 500; font-size: 56px; line-height: 1.12; color: #1F3A2E\">Bạn muốn đi đường nào?<\/h1>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A554E\">Ba cách đầu tư, theo nhịp sống của bạn. Bạn có thể đổi đường sau, hoặc đi nhiều đường cùng lúc.<\/p>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n<sc-for list=\"{{tracks}}\" as=\"t\" hint-placeholder-count=\"3\">\n<button type=\"button\" onClick=\"{{t.pick}}\" aria-pressed=\"{{t.on}}\" style=\"{{t.css}}\">\n<span style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<span style=\"font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: {{t.tagColor}}\">{{t.product}}<\/span>\n<sc-if value=\"{{t.soon}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; padding: 4px 12px; border-radius: 999px; background: #EDE6D6; color: #5C4720\">Sắp mở<\/span><\/sc-if>\n<\/span>\n<span style=\"font-family: 'EB Garamond', Georgia, serif; font-size: 32px; line-height: 1.15\">{{t.name}}<\/span>\n<span style=\"font-size: 16px; line-height: 1.55; opacity: 0.85\">{{t.desc}}<\/span>\n<span style=\"font-size: 15px; line-height: 1.5; opacity: 0.85\">Hợp với bạn khi: {{t.fit}}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n\n<section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; align-items: center; background: #FFFDF8; border: 1px solid #E3DCCB; border-radius: 24px; padding: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #8A6A2E\">VNDCARE · Người đồng hành<\/span>\n<h2 style=\"margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 500; font-size: 36px; line-height: 1.2; color: #1F3A2E\">Tự đi, hay có người đi cùng?<\/h2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A554E\">Một người bạn đồng hành ngồi cùng bạn đọc lại nền tài chính, giữ nhịp khi thị trường lên xuống, và nhắc bạn điều mình đã chọn.<\/p>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<sc-for list=\"{{modes}}\" as=\"m\" hint-placeholder-count=\"2\">\n<button type=\"button\" onClick=\"{{m.pick}}\" aria-pressed=\"{{m.on}}\" style=\"{{m.css}}\">{{m.label}}<\/button>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<section style=\"background: #1F3A2E; color: #F6F2E9; border-radius: 24px; padding: 40px 48px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px\">\n<p style=\"margin: 0; font-family: 'EB Garamond', Georgia, serif; font-size: 28px; line-height: 1.3; max-width: 640px\">{{summary}}<\/p>\n<sc-if value=\"{{withCare}}\" hint-placeholder-val=\"{{ false }}\">\n<a href=\"BuocVaoNha.dc.html\" style=\"background: #D9B26A; color: #1C2420; font-weight: 600; font-size: 17px; text-decoration: none; padding: 16px 32px; border-radius: 999px\">Gặp người đồng hành<\/a>\n<\/sc-if>\n<sc-if value=\"{{alone}}\" hint-placeholder-val=\"{{ true }}\">\n<a href=\"MoTaiKhoan.dc.html\" style=\"background: #D9B26A; color: #1C2420; font-weight: 600; font-size: 17px; text-decoration: none; padding: 16px 32px; border-radius: 999px\">{{cta}}<\/a>\n<\/sc-if>\n<\/section>\n\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #4A554E\">Kết quả đầu tư không được bảo đảm. Mỗi cách đi có rủi ro riêng; người đồng hành sẽ cùng bạn đọc kỹ trước khi bắt đầu.<\/p>\n<\/main>\n<\/div>", "css": "\n:host{display:block;margin:0;background:#F6F2E9}\na{color:#1F3A2E}a:hover{color:#8A6A2E}\n", "enums": {}}, {"id": "MoTaiKhoan.dc.html", "title": "W4 · Mở tài khoản", "w": 1440, "h": 1700, "tpl": "<div style=\"font-family: 'Be Vietnam Pro', Arial, sans-serif; color: #1C2420; background: #F6F2E9; min-height: 100vh\">\n\n<header style=\"border-bottom: 1px solid #E3DCCB\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"Main.dc.html\" style=\"font-family: 'EB Garamond', Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: 1px; color: #1F3A2E; text-decoration: none\">VNDIRECT<\/a>\n<span style=\"font-size: 14px; color: #4A554E\">Mở tài khoản · khoảng 10 phút · có tài khoản trong ngày<\/span>\n<\/div>\n<\/header>\n\n<main style=\"max-width: 1180px; margin: 0 auto; padding: 72px 24px 104px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 760px\">\n<h1 style=\"margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 500; font-size: 52px; line-height: 1.12; color: #1F3A2E\">Mở tài khoản<\/h1>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A554E\">Chỉ những gì luật yêu cầu. Bạn ký gì, bạn nhận gì — đều ghi rõ ở từng bước.<\/p>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<sc-for list=\"{{ways}}\" as=\"w\" hint-placeholder-count=\"2\">\n<button type=\"button\" onClick=\"{{w.pick}}\" aria-pressed=\"{{w.on}}\" style=\"{{w.
